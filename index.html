<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballonkopf</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: transparent;
            overflow: hidden;
            height: 100%;
            touch-action: none;
        }
        #scene-container {
            position: fixed;
            inset: 0;
            cursor: none; /* die Gurke IST der Cursor */
        }
        canvas { display: block; outline: none; }
        .loading {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="scene-container">
        <div class="loading">Lädt...</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // ================== EINSTELLUNGEN ==================
        const CFG = {
            headHeight: 4.6,        // Kopfgröße (Höhe in Welt-Einheiten) – groß in der Mitte
            pickleLength: 1.35,     // Gurkenlänge
            followStiffness: 220,   // wie straff die Gurke am Cursor hängt
            followDamping: 0.75,    // 1 = keine Überschwinger, kleiner = federnder
            headSoftness: 380,      // Widerstand des Kopfes beim Eindrücken (weich)
            headHardness: 4000,     // harter Widerstand ab maxDent
            maxDent: 0.35,          // so tief darf die Gurke weich eindrücken
            wobbleGain: 0.55,       // wie stark der Kopf beim Reiben/Stoßen wabbelt
            wobbleStiffness: 260,   // Wackelpudding-Frequenz (höher = schneller)
            wobbleDamping: 4.5,     // wie schnell das Wabbeln abklingt
            wobbleRadius: 0.95,     // Größe der wabbelnden Zone
            squashGain: 0.10,       // Stauchen beim Aufprall
            headSpring: 45,         // wie stark der Kopf zur Mitte zurückfedert
        };

        // ================== SZENE ==================
        const container = document.getElementById('scene-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
        camera.position.set(0, 0, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        new RGBELoader().load(
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr',
            (tex) => { tex.mapping = THREE.EquirectangularReflectionMapping; scene.environment = tex; },
            undefined,
            () => {
                scene.add(new THREE.AmbientLight(0xffffff, 0.8));
                const d = new THREE.DirectionalLight(0xffffff, 0.8);
                d.position.set(2, 2, 3);
                scene.add(d);
            }
        );

        // ================== JELLY-SHADER (läuft auf der GPU) ==================
        const NWOB = 6;
        const jelly = {
            uSegA:    { value: new THREE.Vector3(100, 100, 100) },
            uSegB:    { value: new THREE.Vector3(100, 100, 101) },
            uCapR:    { value: 0.2 },
            uWobC:    { value: Array.from({ length: NWOB }, () => new THREE.Vector3()) },
            uWobD:    { value: Array.from({ length: NWOB }, () => new THREE.Vector3()) },
            uWobS2:   { value: CFG.wobbleRadius * CFG.wobbleRadius },
            uCenter:  { value: new THREE.Vector3() },
            uSqDir:   { value: new THREE.Vector3(0, 0, 1) },
            uSq:      { value: 0 },
        };

        const JELLY_GLSL = /* glsl */`
            uniform vec3 uSegA, uSegB;
            uniform float uCapR;
            uniform vec3 uWobC[${NWOB}];
            uniform vec3 uWobD[${NWOB}];
            uniform float uWobS2;
            uniform vec3 uCenter, uSqDir;
            uniform float uSq;

            vec3 jellyPos(vec3 p) {
                // 1) Stauchen/Strecken des ganzen Kopfes (volumenerhaltend-ish)
                vec3 r = p - uCenter;
                float a = dot(r, uSqDir);
                vec3 perp = r - uSqDir * a;
                p = uCenter + uSqDir * a * (1.0 - uSq) + perp * (1.0 + 0.5 * uSq);

                // 2) lokale Wabbel-Federn
                vec3 o = vec3(0.0);
                for (int i = 0; i < ${NWOB}; i++) {
                    vec3 d = p - uWobC[i];
                    o += uWobD[i] * exp(-dot(d, d) / uWobS2);
                }
                p += o;

                // 3) Delle: Oberfläche weicht der Gurke (Kapsel) aus
                vec3 ab = uSegB - uSegA;
                float t = clamp(dot(p - uSegA, ab) / max(dot(ab, ab), 1e-6), 0.0, 1.0);
                vec3 dv = p - (uSegA + ab * t);
                float dl = length(dv);
                float k = max(0.0, 1.0 - dl / (1.7 * uCapR));
                vec3 dir = dl > 1e-4 ? dv / dl : vec3(0.0, 0.0, 1.0);
                p += dir * uCapR * k * k;
                return p;
            }
        `;

        function makeJelly(material) {
            material.onBeforeCompile = (shader) => {
                Object.assign(shader.uniforms, jelly);
                shader.vertexShader = shader.vertexShader
                    .replace('#include <common>', '#include <common>\n' + JELLY_GLSL)
                    .replace('#include <project_vertex>', /* glsl */`
                        vec3 jP = (modelMatrix * vec4(transformed, 1.0)).xyz;
                        vec3 jN = normalize(mat3(modelMatrix) * objectNormal);
                        vec3 jT = normalize(cross(jN, abs(jN.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
                        vec3 jB = cross(jN, jT);
                        const float jE = 0.02;
                        vec3 j0 = jellyPos(jP);
                        vec3 j1 = jellyPos(jP + jT * jE);
                        vec3 j2 = jellyPos(jP + jB * jE);
                        vec3 jNN = normalize(cross(j1 - j0, j2 - j0));
                        if (dot(jNN, jN) < 0.0) jNN = -jNN;
                        #ifndef FLAT_SHADED
                            vNormal = normalize((viewMatrix * vec4(jNN, 0.0)).xyz);
                        #endif
                        vec4 mvPosition = viewMatrix * vec4(j0, 1.0);
                        gl_Position = projectionMatrix * mvPosition;
                    `);
            };
            material.customProgramCacheKey = () => 'jelly';
            material.needsUpdate = true;
        }

        // ================== KOPF ==================
        const head = {
            root: new THREE.Group(),   // federt zur Mitte zurück
            vel: new THREE.Vector3(),
            axes: new THREE.Vector3(1, 1.5, 1.2), // Ellipsoid-Halbachsen für Kollision
            ready: false,
        };
        scene.add(head.root);

        function setupHead(model) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const s = CFG.headHeight / size.y;
            model.scale.setScalar(s);
            model.position.copy(center).multiplyScalar(-s);
            head.root.add(model);
            head.axes.copy(size).multiplyScalar(0.5 * s * 0.9);

            model.traverse((c) => {
                if (c.isMesh) {
                    c.frustumCulled = false; // Verformung kann über die BoundingBox hinaus
                    const mats = Array.isArray(c.material) ? c.material : [c.material];
                    mats.forEach(makeJelly);
                }
            });
            head.ready = true;
            document.querySelector('.loading').style.display = 'none';
        }

        new GLTFLoader().load('kopf.glb',
            (gltf) => setupHead(gltf.scene),
            undefined,
            () => {
                const g = new THREE.Group();
                g.add(new THREE.Mesh(
                    new THREE.SphereGeometry(1, 96, 96).scale(0.8, 1, 0.9),
                    new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.5, metalness: 0.3 })
                ));
                setupHead(g);
            }
        );

        // ================== GURKE ==================
        const pickle = {
            root: new THREE.Group(),
            pos: new THREE.Vector3(3, 0, 1),
            vel: new THREE.Vector3(),
            axis: new THREE.Vector3(1, 0, 0),   // Längsachse in Weltkoordinaten
            radius: 0.19,
            half: 0.36,                          // halbe Länge des Kapsel-Segments
        };
        scene.add(pickle.root);

        function setupPickle(model) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            // längste Achse auf X drehen
            const inner = new THREE.Group();
            inner.add(model);
            model.position.sub(center);
            let len = size.x, thick = Math.max(size.y, size.z);
            if (size.y >= size.x && size.y >= size.z) { inner.rotation.z = Math.PI / 2; len = size.y; thick = Math.max(size.x, size.z); }
            else if (size.z >= size.x && size.z >= size.y) { inner.rotation.y = Math.PI / 2; len = size.z; thick = Math.max(size.x, size.y); }
            const s = CFG.pickleLength / len;
            inner.scale.setScalar(s);
            pickle.root.add(inner);
            pickle.radius = thick * s * 0.5;
            pickle.half = Math.max(0.01, CFG.pickleLength / 2 - pickle.radius);
        }

        new GLTFLoader().load('gurke.glb',
            (gltf) => setupPickle(gltf.scene),
            undefined,
            () => {
                const m = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.19, 0.7, 8, 16).rotateZ(Math.PI / 2),
                    new THREE.MeshStandardMaterial({ color: 0x3f8f2f, roughness: 0.6 })
                );
                setupPickle(m);
            }
        );

        // ================== CURSOR ==================
        const raycaster = new THREE.Raycaster();
        const ndc = new THREE.Vector2(0.6, 0);
        let planeZ = 0.6; // Mausrad verschiebt die Gurke nach vorne/hinten
        const target = new THREE.Vector3(3, 0, planeZ);

        function updateTarget() {
            raycaster.setFromCamera(ndc, camera);
            const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -planeZ);
            raycaster.ray.intersectPlane(plane, target);
        }
        addEventListener('pointermove', (e) => {
            ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
        });
        addEventListener('pointerdown', (e) => {
            ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
        });
        addEventListener('wheel', (e) => {
            planeZ = THREE.MathUtils.clamp(planeZ - e.deltaY * 0.002, -1.5, 2.5);
        }, { passive: true });

        // ================== JELLY-FEDERN ==================
        const wob = Array.from({ length: NWOB }, (_, i) => ({
            c: jelly.uWobC.value[i], d: jelly.uWobD.value[i], v: new THREE.Vector3(),
        }));
        const squash = { x: 0, v: 0 };

        function addWobble(point, impulse) {
            let best = null, bestDist = Infinity;
            for (const w of wob) {
                const dist = w.c.distanceTo(point);
                if (dist < bestDist) { bestDist = dist; best = w; }
            }
            if (bestDist > CFG.wobbleRadius * 0.6) {
                // ruhigste Feder recyceln
                best = wob.reduce((a, b) => (a.d.lengthSq() + a.v.lengthSq() * 0.01 < b.d.lengthSq() + b.v.lengthSq() * 0.01 ? a : b));
                if (best.d.lengthSq() < 1e-4) best.c.copy(point);
            }
            best.c.lerp(point, 0.15);
            best.v.add(impulse);
        }

        function stepJelly(dt) {
            for (const w of wob) {
                // a = -k·d - c·v
                w.v.addScaledVector(w.d, -CFG.wobbleStiffness * dt);
                w.v.multiplyScalar(Math.max(0, 1 - CFG.wobbleDamping * dt));
                w.d.addScaledVector(w.v, dt);
                if (w.d.length() > 0.45) w.d.setLength(0.45);
            }
            squash.v += -CFG.wobbleStiffness * 0.8 * squash.x * dt;
            squash.v *= Math.max(0, 1 - CFG.wobbleDamping * dt);
            squash.x = THREE.MathUtils.clamp(squash.x + squash.v * dt, -0.25, 0.25);
            jelly.uSq.value = squash.x;
        }

        // ================== PHYSIK ==================
        const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3(), q = new THREE.Vector3();
        const force = new THREE.Vector3(), contactPt = new THREE.Vector3(), contactN = new THREE.Vector3();
        const desiredAxis = new THREE.Vector3(1, 0, 0);
        let wasTouching = false;
        const SAMPLES = 7;

        function step(dt, t) {
            const hc = head.root.position;

            // --- Gurke folgt dem Cursor (gedämpfte Feder) ---
            const k = CFG.followStiffness;
            const c = 2 * Math.sqrt(k) * CFG.followDamping;
            force.copy(target).sub(pickle.pos).multiplyScalar(k).addScaledVector(pickle.vel, -c);

            // --- Kollision Gurke (Kapsel) ↔ Kopf (Ellipsoid) ---
            let touching = false, penSum = 0;
            contactPt.set(0, 0, 0); contactN.set(0, 0, 0);
            const headForce = tmp2.set(0, 0, 0);
            if (head.ready) {
                for (let i = 0; i < SAMPLES; i++) {
                    const f = (i / (SAMPLES - 1)) * 2 - 1;
                    const p = tmp.copy(pickle.pos).addScaledVector(pickle.axis, f * pickle.half);
                    const rel = p.sub(hc);
                    q.set(rel.x / head.axes.x, rel.y / head.axes.y, rel.z / head.axes.z);
                    const s = Math.max(q.length(), 1e-4);
                    const n = q.set(q.x / head.axes.x, q.y / head.axes.y, q.z / head.axes.z).normalize();
                    const dist = (s - 1) * rel.length() / s;      // ≈ Abstand zur Kopfoberfläche
                    const pen = pickle.radius - dist;
                    if (pen > 0) {
                        touching = true;
                        const mag = CFG.headSoftness * pen + CFG.headHardness * Math.max(0, pen - CFG.maxDent);
                        force.addScaledVector(n, mag / SAMPLES * 2.2);
                        headForce.addScaledVector(n, -mag / SAMPLES);
                        // Kontaktpunkt auf der Oberfläche
                        contactPt.addScaledVector(rel.add(hc).addScaledVector(n, -(pickle.radius - pen)), pen);
                        contactN.addScaledVector(n, pen);
                        penSum += pen;
                    }
                }
            }

            // Pudding schluckt Energie: Bewegung in den Kopf hinein wird gebremst
            if (touching) {
                contactPt.divideScalar(penSum);
                contactN.normalize();
                const vn = pickle.vel.dot(contactN);
                if (vn < 0) force.addScaledVector(contactN, -vn * 12);

                // Wabbeln: Reibung + Stoß an der Kontaktstelle
                const impulse = tmp.copy(pickle.vel).multiplyScalar(CFG.wobbleGain * dt * 9);
                impulse.addScaledVector(contactN, -Math.min(penSum, 0.6) * dt * 6);
                addWobble(contactPt, impulse);

                if (!wasTouching && vn < -0.5) {
                    // Aufprall: Stauchung entlang der Stoßrichtung + kräftiger Wabbel
                    jelly.uSqDir.value.lerp(contactN, 0.7).normalize();
                    squash.v += Math.min(-vn, 12) * CFG.squashGain;
                    addWobble(contactPt, tmp.copy(contactN).multiplyScalar(vn * 0.12));
                }
            }
            wasTouching = touching;

            pickle.vel.addScaledVector(force, dt);
            if (pickle.vel.length() > 25) pickle.vel.setLength(25);
            pickle.pos.addScaledVector(pickle.vel, dt);

            // --- Kopf bleibt in der Mitte, gibt aber kurz nach ---
            head.vel.addScaledVector(headForce, dt * 0.004);
            head.vel.addScaledVector(hc, -CFG.headSpring * dt);
            head.vel.multiplyScalar(Math.max(0, 1 - 6 * dt));
            hc.addScaledVector(head.vel, dt);

            stepJelly(dt);

            // --- Gurke ausrichten: Spitze zeigt in Bewegungsrichtung ---
            const sp = pickle.vel.length();
            if (sp > 0.6) {
                tmp.copy(pickle.vel).divideScalar(sp);
                if (tmp.dot(desiredAxis) < 0 && sp < 4) tmp.negate(); // nicht ständig umklappen
                desiredAxis.lerp(tmp, Math.min(1, sp * 0.6 * dt)).normalize();
            } else {
                // im Leerlauf: sanftes Schaukeln
                tmp.set(Math.cos(t * 0.7), Math.sin(t * 0.9) * 0.35, Math.sin(t * 0.5) * 0.3).normalize();
                desiredAxis.lerp(tmp, 0.6 * dt).normalize();
            }
            pickle.axis.lerp(desiredAxis, Math.min(1, 10 * dt)).normalize();
        }

        // ================== LOOP ==================
        const clock = new THREE.Clock();
        const X = new THREE.Vector3(1, 0, 0);
        const idleRot = new THREE.Euler();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 1 / 30);
            const t = clock.elapsedTime;

            updateTarget();
            const sub = 3;
            for (let i = 0; i < sub; i++) step(dt / sub, t);

            // Gurke positionieren
            pickle.root.position.copy(pickle.pos);
            pickle.root.quaternion.setFromUnitVectors(X, pickle.axis);

            // Kopf: leichtes Schweben/Schaukeln
            idleRot.set(Math.sin(t * 0.6) * 0.05, Math.sin(t * 0.4) * 0.12, Math.sin(t * 0.5) * 0.03);
            head.root.rotation.copy(idleRot);

            // Shader-Uniforms (Weltkoordinaten)
            jelly.uCenter.value.copy(head.root.position);
            jelly.uCapR.value = pickle.radius * 1.12;
            jelly.uSegA.value.copy(pickle.pos).addScaledVector(pickle.axis, -pickle.half);
            jelly.uSegB.value.copy(pickle.pos).addScaledVector(pickle.axis, pickle.half);

            renderer.render(scene, camera);
        }
        animate();

        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>

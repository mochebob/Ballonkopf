<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballonkopf</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: transparent;
            overflow: hidden;
            height: 100%;
            touch-action: none;
        }
        #scene-container {
            position: fixed;
            inset: 0;
            cursor: none; /* die Gurke IST der Cursor */
        }
        canvas { display: block; outline: none; }
        .loading {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="scene-container">
        <div class="loading">Lädt...</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // ================== EINSTELLUNGEN ==================
        const CFG = {
            headHeight: 4.6,        // Kopfgröße (Höhe in Welt-Einheiten) – groß in der Mitte
            pickleLength: 1.35,     // Gurkenlänge
            followStiffness: 220,   // wie straff die Gurke am Cursor hängt
            followDamping: 0.75,    // 1 = keine Überschwinger, kleiner = federnder

            // Punchingball (Kopf kippt um den festen Punkt unten)
            headInertia: 18,        // "Gewicht" des Kopfes – höher = schwerer zu schubsen
            headStiffness: 60,      // Rückstellfeder – höher = schneller zurück
            headDamping: 1.0,       // wie schnell das Schaukeln abklingt
            maxTilt: 0.6,           // maximales Kippen (Radiant)
            neckBend: 0.24,         // Anteil der Höhe, der sich biegt (der Rest kippt starr)
            bounce: 0.35,           // wie stark die Gurke abprallt (0–1)

            // Wackelpudding obendrauf
            whipGain: 0.07,         // Nachschwingen der oberen Kopfhälfte
            whipStiffness: 300,
            whipDamping: 2.6,
            wobbleGain: 0.22,       // lokales Wabbeln an der Trefferstelle
            wobbleStiffness: 170,   // niedriger = langsameres, puddingartiges Wabbeln
            wobbleDamping: 2.8,
            wobbleRadius: 1.25,
            squashGain: 0.022,      // Stauchen bei Treffern
            squashDamping: 2.5,

            // Treffer-Gefühl
            rippleAmp: 0.16,        // Stärke der Welle, die über den Kopf läuft
            rippleSpeed: 3.2,       // Ausbreitungsgeschwindigkeit
            rippleWavelength: 0.9,
            rippleDecay: 2.2,
            pickleSquash: 0.35,     // wie stark die Gurke beim Aufprall gestaucht wird
            cameraShake: 0.06,      // Kamera-Wackler bei harten Treffern

            // Sound
            soundVolume: 0.8,

            // Schießmodus
            shotSize: 0.38,         // Mini-Gurke relativ zur großen
            shotSpeed: 22,          // Geschwindigkeit
            shotMass: 0.35,         // Wucht pro Gurke (große Gurke = 1)
            shotGravity: 7,         // wie schnell sie nach dem Abprallen runterfallen
            shotBounce: 0.45,
            fireRate: 9,            // Schuss pro Sekunde bei gedrückter Maustaste
            shotLifetime: 4,        // Sekunden bis sie verschwinden
            maxShots: 40,

            // Abbeißen
            biteSize: 0.3,          // so viel Gurke geht pro Biss weg

            // Rache: ab einer gewissen Menge schießt er zurück
            eatsToRage: 8,          // so viele Bissen/geschluckte Gurken füllen die Wut-Leiste
            hitsToRage: 30,         // ... oder so viele Treffer
            rageCharge: 0.9,        // Sekunden Mund aufreißen + beben
            rageDuration: 2.4,      // Sekunden Dauerfeuer
            rageFireRate: 9,        // Gurken pro Sekunde
            rageSpeed: 13,          // wie schnell sie auf dich zufliegen

            // Mund
            mouthReach: 1.9,        // ab dieser Entfernung öffnet er sich für die Gurke
            mouthRadius: 0.45,      // so nah muss eine Gurke an die Mundmitte zum Schnappen/Schlucken
            mouthMaxOpen: 1.0,      // 0..1 – wie weit der Shape Key maximal geht
            ohOnHit: 0.55,          // wie weit er bei Treffern "Oh!" macht
        };

        // ================== SZENE ==================
        const container = document.getElementById('scene-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
        camera.position.set(0, 0, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        new RGBELoader().load(
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr',
            (tex) => { tex.mapping = THREE.EquirectangularReflectionMapping; scene.environment = tex; },
            undefined,
            () => {
                scene.add(new THREE.AmbientLight(0xffffff, 0.8));
                const d = new THREE.DirectionalLight(0xffffff, 0.8);
                d.position.set(2, 2, 3);
                scene.add(d);
            }
        );

        // ================== VERFORMUNGS-SHADER (GPU) ==================
        const NWOB = 6;
        const NRIP = 4;
        const U = {
            uAnchor: { value: new THREE.Vector3(0, -2.3, 0) }, // fester Punkt unten
            uH:      { value: 4.6 },
            uBend:   { value: CFG.neckBend },
            uTilt:   { value: new THREE.Vector3() },  // Kipp-Rotation (Achse·Winkel)
            uWhip:   { value: new THREE.Vector3() },  // Nachschwingen oben
            uWobC:   { value: Array.from({ length: NWOB }, () => new THREE.Vector3()) },
            uWobD:   { value: Array.from({ length: NWOB }, () => new THREE.Vector3()) },
            uWobS2:  { value: CFG.wobbleRadius ** 2 },
            uSqDir:  { value: new THREE.Vector3(0, 1, 0) },
            uSq:     { value: 0 },
            uSegA:   { value: new THREE.Vector3(100, 100, 100) },
            uSegB:   { value: new THREE.Vector3(100, 100, 101) },
            uCapR:   { value: 0.2 },
            uRipC:   { value: Array.from({ length: NRIP }, () => new THREE.Vector3()) },
            uRipA:   { value: new Array(NRIP).fill(0) },
            uRipT:   { value: new Array(NRIP).fill(99) },
            uRipK:   { value: (2 * Math.PI) / CFG.rippleWavelength },
            uRipV:   { value: CFG.rippleSpeed },
            uRipDecay: { value: CFG.rippleDecay },
        };

        const GLSL = /* glsl */`
            uniform vec3 uAnchor, uTilt, uWhip, uSqDir, uSegA, uSegB;
            uniform float uH, uBend, uSq, uWobS2, uCapR;
            uniform vec3 uWobC[${NWOB}];
            uniform vec3 uWobD[${NWOB}];
            uniform vec3 uRipC[${NRIP}];
            uniform float uRipA[${NRIP}];
            uniform float uRipT[${NRIP}];
            uniform float uRipK, uRipV, uRipDecay;

            vec3 rotAA(vec3 v, vec3 aa) {          // Rodrigues: Rotation um Achse·Winkel
                float a = length(aa);
                if (a < 1e-6) return v;
                vec3 k = aa / a;
                return v * cos(a) + cross(k, v) * sin(a) + k * dot(k, v) * (1.0 - cos(a));
            }

            vec3 deform(vec3 p) {
                vec3 r = p - uAnchor;
                float h = clamp(r.y / uH, 0.0, 1.0);   // 0 = unten (fest), 1 = Scheitel
                float fix = smoothstep(0.0, 0.18, h);

                // Stauchen (Boden bleibt stehen)
                float a = dot(r, uSqDir);
                vec3 perp = r - uSqDir * a;
                r = mix(r, uSqDir * a * (1.0 - uSq) + perp * (1.0 + 0.5 * uSq), fix);

                // lokales Wabbeln an Trefferstellen
                vec3 o = vec3(0.0);
                for (int i = 0; i < ${NWOB}; i++) {
                    vec3 d = (uAnchor + r) - uWobC[i];
                    o += uWobD[i] * exp(-dot(d, d) / uWobS2);
                }
                r += o * fix;

                // Schockwelle: Delle an der Trefferstelle, die als Ring über den Kopf läuft
                vec3 radial = normalize(r - vec3(0.0, 0.5 * uH, 0.0));
                float w = 0.0;
                for (int i = 0; i < ${NRIP}; i++) {
                    float age = uRipT[i];
                    float d = length((uAnchor + r) - uRipC[i]);
                    float x = d - uRipV * age;
                    float env = exp(-x * x / 0.35) * exp(-uRipDecay * age) / (1.0 + 0.8 * d);
                    w += -uRipA[i] * cos(uRipK * x) * env;
                }
                r += radial * w * fix;

                // Punchingball: Hals biegt sich, Kopf kippt; oben schwingt's nach
                float s = smoothstep(0.0, uBend, h);
                r = rotAA(r, uTilt * s + uWhip * h * h * h);
                vec3 q = uAnchor + r;

                // kleine Ausweich-Delle (nur damit Nase & Co nicht durch die Gurke stechen)
                vec3 ab = uSegB - uSegA;
                float t = clamp(dot(q - uSegA, ab) / max(dot(ab, ab), 1e-6), 0.0, 1.0);
                vec3 dv = q - (uSegA + ab * t);
                float dl = length(dv);
                float k = max(0.0, 1.0 - dl / (1.5 * uCapR));
                q += (dl > 1e-4 ? dv / dl : vec3(0.0, 0.0, 1.0)) * uCapR * k * k;
                return q;
            }
        `;

        function makeJelly(material) {
            material.onBeforeCompile = (shader) => {
                Object.assign(shader.uniforms, U);
                shader.vertexShader = shader.vertexShader
                    .replace('#include <common>', '#include <common>\n' + GLSL)
                    .replace('#include <project_vertex>', /* glsl */`
                        vec3 jP = (modelMatrix * vec4(transformed, 1.0)).xyz;
                        vec3 jN = normalize(mat3(modelMatrix) * objectNormal);
                        vec3 jT = normalize(cross(jN, abs(jN.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
                        vec3 jB = cross(jN, jT);
                        const float jE = 0.02;
                        vec3 j0 = deform(jP);
                        vec3 j1 = deform(jP + jT * jE);
                        vec3 j2 = deform(jP + jB * jE);
                        vec3 jNN = normalize(cross(j1 - j0, j2 - j0));
                        if (dot(jNN, rotAA(jN, uTilt)) < 0.0) jNN = -jNN;
                        #ifndef FLAT_SHADED
                            vNormal = normalize((viewMatrix * vec4(jNN, 0.0)).xyz);
                        #endif
                        vec4 mvPosition = viewMatrix * vec4(j0, 1.0);
                        gl_Position = projectionMatrix * mvPosition;
                    `);
            };
            material.customProgramCacheKey = () => 'jelly2';
            material.needsUpdate = true;
        }

        // ================== KOPF ==================
        const head = {
            root: new THREE.Group(),
            center: new THREE.Vector3(),          // Ellipsoid-Mitte (Ruhelage)
            axes: new THREE.Vector3(1, 1.5, 1.2), // Ellipsoid-Halbachsen
            tilt: U.uTilt.value, tiltVel: new THREE.Vector3(),
            whip: U.uWhip.value, whipVel: new THREE.Vector3(),
            ready: false,
        };
        scene.add(head.root);

        function setupHead(model) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const s = CFG.headHeight / size.y;
            model.scale.setScalar(s);
            model.position.copy(center).multiplyScalar(-s);
            head.root.add(model);

            head.axes.copy(size).multiplyScalar(0.5 * s * 0.92);
            head.center.set(0, 0, 0);
            U.uH.value = CFG.headHeight;
            U.uAnchor.value.set(0, -CFG.headHeight / 2, 0);

            // Das Modell kann aus mehreren Teilen bestehen (z. B. Haut + Mundinnenraum)
            const meshes = [];
            model.traverse((c) => {
                if (c.isMesh) {
                    c.frustumCulled = false;
                    [].concat(c.material).forEach(makeJelly);
                    meshes.push(c);
                }
            });
            const skin = meshes.reduce((a, b) => (b.geometry.attributes.position.count > a.geometry.attributes.position.count ? b : a));
            [].concat(skin.material).forEach((m) => swapReg.head.push(m));   // nur die Haut wird getauscht
            const mouthMeshes = meshes.filter((c) => c.morphTargetDictionary && 'MundAuf' in c.morphTargetDictionary);
            if (mouthMeshes.length) setupMouth(mouthMeshes.includes(skin) ? skin : mouthMeshes[0], mouthMeshes);
            head.ready = true;
            snapshotSwap();
            document.querySelector('.loading').style.display = 'none';
        }

        // ================== MUND (Shape Key "MundAuf") ==================
        const mouth = {
            mesh: null, index: 0,
            x: 0, v: 0,                       // aktuelle Öffnung 0..1 + Geschwindigkeit
            oh: 0,                            // "Oh!" nach Treffern
            want: 0,                          // Vorfreude (Gurke kommt näher)
            chomp: 0,                         // Zuschnappen (Timer)
            chew: 0,                          // Kauen nach dem Schlucken (Timer)
            cooldown: 0,
            restTop: new THREE.Vector3(),     // Unterlippe in Ruhelage (Welt)
            openDelta: new THREE.Vector3(),   // Weg der Unterlippe bei voll offen (Welt)
            world: new THREE.Vector3(),       // aktuelle Mundmitte (Welt, inkl. Kippen)
        };

        // Wangen glätten: Wo der Shape Key Flächen stark auseinanderreißt, wird die
        // Verschiebung weich zwischen festem Oberkopf und Unterkiefer verteilt.
        function smoothMorph(geo, ti) {
            const P = geo.attributes.position, D = geo.morphAttributes.position[ti];
            const idx = geo.index ? geo.index.array : null;
            if (!idx) return;
            const rel = geo.morphTargetsRelative;
            // UV-Nähte zusammenschweißen (gleiche Position = gleicher Punkt)
            const map = new Map(), gid = new Int32Array(P.count);
            let G = 0;
            for (let i = 0; i < P.count; i++) {
                const key = Math.round(P.getX(i) * 50) + '_' + Math.round(P.getY(i) * 50) + '_' + Math.round(P.getZ(i) * 50);
                let g = map.get(key);
                if (g === undefined) { g = G++; map.set(key, g); }
                gid[i] = g;
            }
            const pos = new Float32Array(G * 3), d = new Float32Array(G * 3);
            for (let i = 0; i < P.count; i++) {
                const g = gid[i] * 3;
                pos[g] = P.getX(i); pos[g + 1] = P.getY(i); pos[g + 2] = P.getZ(i);
                d[g] = D.getX(i) - (rel ? 0 : P.getX(i));
                d[g + 1] = D.getY(i) - (rel ? 0 : P.getY(i));
                d[g + 2] = D.getZ(i) - (rel ? 0 : P.getZ(i));
            }
            // Nachbarn + gerissene Flächen finden
            const nb = Array.from({ length: G }, () => new Set());
            const free = new Uint8Array(G);
            const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
            const area = (o) => {
                const i0 = gid[idx[o]] * 3, i1 = gid[idx[o + 1]] * 3, i2 = gid[idx[o + 2]] * 3;
                const A = (k) => { a.set(pos[i0] + k * d[i0], pos[i0 + 1] + k * d[i0 + 1], pos[i0 + 2] + k * d[i0 + 2]);
                    b.set(pos[i1] + k * d[i1], pos[i1 + 1] + k * d[i1 + 1], pos[i1 + 2] + k * d[i1 + 2]);
                    c.set(pos[i2] + k * d[i2], pos[i2 + 1] + k * d[i2 + 1], pos[i2 + 2] + k * d[i2 + 2]);
                    return b.sub(a).cross(c.sub(a)).length(); };
                return A(1) / Math.max(A(0), 1e-9);
            };
            let torn = 0;
            for (let o = 0; o < idx.length; o += 3) {
                const g0 = gid[idx[o]], g1 = gid[idx[o + 1]], g2 = gid[idx[o + 2]];
                nb[g0].add(g1).add(g2); nb[g1].add(g0).add(g2); nb[g2].add(g0).add(g1);
                if (area(o) > 2.5) { free[g0] = free[g1] = free[g2] = 1; torn++; }
            }
            if (!torn) return;
            // Bereich um die Risse etwas erweitern (weicher Übergang)
            for (let ring = 0; ring < 5; ring++) {
                const add = [];
                for (let g = 0; g < G; g++) if (free[g]) for (const n of nb[g]) if (!free[n]) add.push(n);
                add.forEach((n) => { free[n] = 1; });
            }
            // harmonisch glätten: fester Oberkopf + fester Unterkiefer, dazwischen weich
            const nbArr = nb.map((s) => Int32Array.from(s));
            const tmpD = new Float32Array(d);
            for (let it = 0; it < 250; it++) {
                for (let g = 0; g < G; g++) {
                    if (!free[g]) continue;
                    const n = nbArr[g];
                    let x = 0, y = 0, z = 0;
                    for (let k = 0; k < n.length; k++) { const m = n[k] * 3; x += d[m]; y += d[m + 1]; z += d[m + 2]; }
                    tmpD[g * 3] = x / n.length; tmpD[g * 3 + 1] = y / n.length; tmpD[g * 3 + 2] = z / n.length;
                }
                d.set(tmpD);
            }
            for (let i = 0; i < P.count; i++) {
                const g = gid[i] * 3;
                D.setXYZ(i, d[g] + (rel ? 0 : P.getX(i)), d[g + 1] + (rel ? 0 : P.getY(i)), d[g + 2] + (rel ? 0 : P.getZ(i)));
            }
            D.needsUpdate = true;
        }

        function setupMouth(mesh, all = [mesh]) {
            mouth.mesh = mesh;
            mouth.meshes = all;                 // alle Teile mit Shape Key "MundAuf" bewegen sich mit
            mouth.index = mesh.morphTargetDictionary['MundAuf'];
            for (const m of all) if (m !== mesh && m.geometry.morphAttributes.normal) delete m.geometry.morphAttributes.normal;
            const geo = mesh.geometry;
            // Shape-Key-Normalen würden nach dem Glätten nicht mehr passen
            if (geo.morphAttributes.normal) delete geo.morphAttributes.normal;
            smoothMorph(geo, mouth.index);

            // Mundposition aus dem Shape Key ableiten: die obersten stark bewegten Punkte = Unterlippe
            const P = geo.attributes.position, D = geo.morphAttributes.position[mouth.index];
            const rel = geo.morphTargetsRelative;
            const dl = [];
            let max = 0;
            for (let i = 0; i < P.count; i++) {
                const dx = D.getX(i) - (rel ? 0 : P.getX(i)), dy = D.getY(i) - (rel ? 0 : P.getY(i)), dz = D.getZ(i) - (rel ? 0 : P.getZ(i));
                const L = Math.hypot(dx, dy, dz);
                max = Math.max(max, L);
                dl.push([i, L, dx, dy, dz]);
            }
            const moving = dl.filter((e) => e[1] > max * 0.6).sort((p, q) => P.getY(q[0]) - P.getY(p[0]));
            const top = moving.slice(0, Math.max(5, Math.floor(moving.length * 0.08)))
                .filter((e) => P.getZ(e[0]) > P.getZ(moving[0][0]) - 20); // nur die Vorderseite
            const lip = new THREE.Vector3(), del = new THREE.Vector3();
            for (const e of top) { lip.x += P.getX(e[0]); lip.y += P.getY(e[0]); lip.z += P.getZ(e[0]); del.x += e[2]; del.y += e[3]; del.z += e[4]; }
            lip.divideScalar(top.length); del.divideScalar(top.length);

            head.root.updateMatrixWorld(true);
            mouth.restTop.copy(lip).applyMatrix4(mesh.matrixWorld);
            mouth.openDelta.copy(del).transformDirection(mesh.matrixWorld).multiplyScalar(del.length() * mesh.matrixWorld.getMaxScaleOnAxis());
            // Mundpunkt auf die Kollisions-Oberfläche legen, damit Gurken ihn auch erreichen
            const r = mouth.restTop, A = head.axes;
            const ez = head.center.z + A.z * Math.sqrt(Math.max(0, 1 - (r.x / A.x) ** 2 - ((r.y - head.center.y) / A.y) ** 2));
            r.z = Math.max(r.z, ez - 0.05);
        }

        new GLTFLoader().load('kopf.glb',
            (gltf) => setupHead(gltf.scene),
            undefined,
            () => {
                const g = new THREE.Group();
                g.add(new THREE.Mesh(
                    new THREE.SphereGeometry(1, 96, 96).scale(0.8, 1, 0.9),
                    new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.5, metalness: 0.3 })
                ));
                setupHead(g);
            }
        );

        // ================== GURKE ==================
        const pickle = {
            root: new THREE.Group(),
            pos: new THREE.Vector3(3.5, 0, 1),
            vel: new THREE.Vector3(),
            axis: new THREE.Vector3(1, 0, 0),
            radius: 0.22,
            half: 0.45,
            cutP: 10, cutN: -10,   // Bisskanten entlang der Achse (+Ende / −Ende), 10 = unangebissen
            respawn: 0,            // >0: Gurke ist aufgegessen, neue kommt gleich
            grow: 1, growV: 0,     // Auftauch-Animation der neuen Gurke
        };
        scene.add(pickle.root);
        let pickleTemplate = null; // Vorlage für die Mini-Gurken (ohne Bissspuren)

        // --- Biss-Shader: schneidet die Gurke mit Zahnabdruck ab, Innenseite hellgrün ---
        const BITE = {
            uBC:    { value: new THREE.Vector3() },     // Gurkenmitte
            uBA:    { value: new THREE.Vector3(1, 0, 0) }, // Gurkenachse
            uBP:    { value: new THREE.Vector3(0, 1, 0) }, // Referenz quer zur Achse (für Zähne)
            uCutP:  { value: 10 },
            uCutN:  { value: -10 },
            uTooth: { value: 0.07 },
        };
        function makeBiteable(material) {
            material.onBeforeCompile = (shader) => {
                Object.assign(shader.uniforms, BITE);
                shader.vertexShader = shader.vertexShader
                    .replace('#include <common>', '#include <common>\nvarying vec3 vBiteW;')
                    .replace('#include <project_vertex>', '#include <project_vertex>\nvBiteW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
                shader.fragmentShader = shader.fragmentShader
                    .replace('#include <common>', `#include <common>
                        varying vec3 vBiteW;
                        uniform vec3 uBC, uBA, uBP;
                        uniform float uCutP, uCutN, uTooth;`)
                    .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
                        {
                            vec3 bd = vBiteW - uBC;
                            float ba = dot(bd, uBA);
                            vec3 br = bd - uBA * ba;
                            float ang = atan(dot(br, cross(uBA, uBP)), dot(br, uBP));
                            float tooth = uTooth * (0.5 + 0.5 * cos(ang * 5.0));   // Zahnabdruck
                            if (ba > uCutP - tooth || ba < uCutN + tooth) discard;
                        }`);
            };
            material.customProgramCacheKey = () => 'bite';
            material.needsUpdate = true;
            return material;
        }
        // Gurke für den Biss vorbereiten: eigene Materialien + hellgrüne Innenseite
        function prepareBite(inner) {
            const fleshMat = makeBiteable(new THREE.MeshStandardMaterial({ color: 0xd9e89a, roughness: 0.55, side: THREE.BackSide }));
            swapReg.flesh = fleshMat;
            const meshes = [];
            inner.traverse((c) => { if (c.isMesh) meshes.push(c); });
            const bite = (x) => {
                const m = makeBiteable(x.clone());
                m.side = THREE.FrontSide;          // Innenseite zeigt das hellgrüne Fruchtfleisch
                swapReg.pickle.push(m);
                return m;
            };
            for (const m of meshes) {
                m.material = Array.isArray(m.material) ? m.material.map(bite) : bite(m.material);
                const flesh = new THREE.Mesh(m.geometry, fleshMat);
                flesh.renderOrder = -1;
                m.add(flesh);
            }
        }
        const pickleEnds = () => {
            const L = CFG.pickleLength / 2;
            return [Math.max(pickle.cutN, -L), Math.min(pickle.cutP, L)];   // [−Ende, +Ende]
        };

        function setupPickle(model) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const inner = new THREE.Group();
            inner.add(model);
            model.position.sub(center);
            let len = size.x, thick = Math.max(size.y, size.z);
            if (size.y >= size.x && size.y >= size.z) { inner.rotation.z = Math.PI / 2; len = size.y; thick = Math.max(size.x, size.z); }
            else if (size.z >= size.x && size.z >= size.y) { inner.rotation.y = Math.PI / 2; len = size.z; thick = Math.max(size.x, size.y); }
            const s = CFG.pickleLength / len;
            inner.scale.setScalar(s);
            pickleTemplate = inner.clone();   // saubere Vorlage für die Mini-Gurken
            pickleTemplate.traverse((c) => { if (c.isMesh) [].concat(c.material).forEach((m) => swapReg.pickle.push(m)); });
            prepareBite(inner);
            pickle.root.add(inner);
            pickle.radius = thick * s * 0.5;
            pickle.half = Math.max(0.01, CFG.pickleLength / 2 - pickle.radius);
            snapshotSwap();
        }

        // ================== TEXTUR-TAUSCH ==================
        const swapReg = { head: [], pickle: [], flesh: null, snap: null, orig: new Map(), on: false };
        const SWAP_MAPS = ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'specularColorMap'];
        const takeSnap = (m) => {
            const s = { color: m.color.clone(), roughness: m.roughness, metalness: m.metalness, normalScale: m.normalScale ? m.normalScale.clone() : null };
            for (const k of SWAP_MAPS) s[k] = m[k] || null;
            return s;
        };
        // sobald Kopf UND Gurke geladen sind, Originale merken
        function snapshotSwap() {
            if (swapReg.snap || !swapReg.head.length || !swapReg.pickle.length) return;
            // jedes Material merkt sich sein Original, damit "zurücktauschen" exakt wiederherstellt
            [...swapReg.head, ...swapReg.pickle].forEach((m) => swapReg.orig.set(m, takeSnap(m)));
            swapReg.snap = { head: swapReg.orig.get(swapReg.head[0]), pickle: swapReg.orig.get(swapReg.pickle[0]) };
            if (swapReg.on) applySwap();
        }
        function putSnap(m, s) {
            for (const k of SWAP_MAPS) if (k in m || s[k]) m[k] = s[k];
            m.color.copy(s.color);
            m.roughness = s.roughness;
            m.metalness = s.metalness;
            if (s.normalScale && m.normalScale) m.normalScale.copy(s.normalScale);
            m.needsUpdate = true;
        }
        function applySwap() {
            const S = swapReg.snap;
            if (!S) return;
            const on = swapReg.on;
            swapReg.head.forEach((m) => putSnap(m, on ? S.pickle : swapReg.orig.get(m)));
            swapReg.pickle.forEach((m) => putSnap(m, on ? S.head : swapReg.orig.get(m)));
            // Gurken-Inneres: normal hellgrün, getauscht fleischig-rosa
            if (swapReg.flesh) swapReg.flesh.color.set(on ? 0xe9a597 : 0xd9e89a);
            crumbMats[0].color.set(on ? 0xe9a597 : 0xd9e89a);
            crumbMats[1].color.set(on ? 0xb5785e : 0x4f7a22);
        }
        function toggleSwap() {
            swapReg.on = !swapReg.on;
            applySwap();
            swapBtn.style.background = swapReg.on ? 'rgba(255,255,255,.92)' : 'transparent';
            swapBtn.style.color = swapReg.on ? '#222' : 'rgba(128,128,128,.95)';
        }

        new GLTFLoader().load('gurke.glb',
            (gltf) => setupPickle(gltf.scene),
            undefined,
            () => setupPickle(new THREE.Mesh(
                new THREE.CapsuleGeometry(0.22, 0.9, 8, 16).rotateZ(Math.PI / 2),
                new THREE.MeshStandardMaterial({ color: 0x3f8f2f, roughness: 0.6 })
            ))
        );

        // ================== CURSOR ==================
        const raycaster = new THREE.Raycaster();
        const ndc = new THREE.Vector2(0.7, 0);
        let planeZ = 0.8; // Mausrad: Gurke nach vorne/hinten
        const target = new THREE.Vector3(3.5, 0, planeZ);
        const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        const eo = new THREE.Vector3(), ed = new THREE.Vector3(), en = new THREE.Vector3();
        function updateTarget() {
            raycaster.setFromCamera(ndc, camera);
            const ray = raycaster.ray;
            // Über dem Kopf: Gurke gleitet auf der Gesichtsoberfläche und drückt leicht hinein
            if (head.ready && mode === 'steer') {
                const A = head.axes;
                eo.copy(ray.origin).sub(head.center).divide(A);
                ed.copy(ray.direction).divide(A);
                const a = ed.dot(ed), b = 2 * eo.dot(ed), c = eo.dot(eo) - 1;
                const disc = b * b - 4 * a * c;
                if (disc > 0) {
                    const tHit = (-b - Math.sqrt(disc)) / (2 * a);
                    target.copy(ray.origin).addScaledVector(ray.direction, tHit);
                    en.copy(target).sub(head.center).divide(A).divide(A).normalize();
                    target.addScaledVector(en, pickle.radius - 0.12);
                    target.z += planeZ - 0.8; // Mausrad wirkt weiterhin
                    return;
                }
            }
            plane.constant = -planeZ;
            ray.intersectPlane(plane, target);
        }
        const setNdc = (e) => ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
        addEventListener('pointermove', setNdc);
        addEventListener('pointerdown', setNdc);
        addEventListener('wheel', (e) => {
            planeZ = THREE.MathUtils.clamp(planeZ - e.deltaY * 0.002, -1.5, 2.5);
        }, { passive: true });

        // ================== HILFSFUNKTIONEN ==================
        const bendS = (h) => { const x = THREE.MathUtils.clamp(h / CFG.neckBend, 0, 1); return x * x * (3 - 2 * x); };
        const quat = new THREE.Quaternion();
        const aaTmp = new THREE.Vector3();

        function rotateAA(v, aa, sign = 1) {
            const a = aa.length();
            if (a < 1e-6) return v;
            quat.setFromAxisAngle(aaTmp.copy(aa).divideScalar(a), a * sign);
            return v.applyQuaternion(quat);
        }
        // Rotationsvektor (Achse·Winkel), der an Höhe h wirkt
        function angleAt(h, out) {
            return out.copy(head.tilt).multiplyScalar(bendS(h)).addScaledVector(head.whip, h * h * h);
        }
        const heightOf = (p) => THREE.MathUtils.clamp((p.y - U.uAnchor.value.y) / CFG.headHeight, 0, 1);

        // ================== JELLY-FEDERN ==================
        const wob = Array.from({ length: NWOB }, (_, i) => ({
            c: U.uWobC.value[i], d: U.uWobD.value[i], v: new THREE.Vector3(),
        }));
        const squash = { x: 0, v: 0 };

        function addWobble(restPoint, impulse) {
            let best = null, bestDist = Infinity;
            for (const w of wob) {
                const dist = w.c.distanceTo(restPoint);
                if (dist < bestDist) { bestDist = dist; best = w; }
            }
            if (bestDist > CFG.wobbleRadius * 0.6) {
                best = wob.reduce((a, b) => (a.d.lengthSq() + a.v.lengthSq() * 0.01 < b.d.lengthSq() + b.v.lengthSq() * 0.01 ? a : b));
                best.c.copy(restPoint);
            } else best.c.lerp(restPoint, 0.2);
            best.v.add(impulse);
        }

        // ================== TREFFER-GEFÜHL ==================
        const pSquash = { x: 0, v: 0 };
        let shake = 0, ripIdx = 0, lastImpact = 0;

        function impact(restPoint, speed) {
            const now = performance.now();
            const s = THREE.MathUtils.clamp(speed / 10, 0, 1);    // 0..1 Schlagstärke
            if (now - lastImpact < 45) return;                     // nicht dauerfeuern
            lastImpact = now;

            // Schockwelle
            U.uRipC.value[ripIdx].copy(restPoint);
            U.uRipA.value[ripIdx] = CFG.rippleAmp * (0.25 + 0.75 * s);
            U.uRipT.value[ripIdx] = 0;
            ripIdx = (ripIdx + 1) % NRIP;

            shake = Math.max(shake, CFG.cameraShake * s * s);
            mouth.oh = Math.max(mouth.oh, CFG.ohOnHit * (0.4 + 0.6 * s));
            playSquish(s);
            if (s > 0.25) addRage(1 / CFG.hitsToRage);
        }

        // ================== SOUND (WebAudio, live erzeugt – keine Dateien) ==================
        let actx = null, master = null, noiseBuf = null;
        const hint = document.createElement('div');
        hint.textContent = '🔊 Klicken für Sound';
        hint.style.cssText = 'position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font:12px sans-serif;color:rgba(128,128,128,.8);pointer-events:none;transition:opacity .6s';
        document.body.appendChild(hint);

        function initAudio() {
            if (!actx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                actx = new AC();
                master = actx.createDynamicsCompressor();
                const out = actx.createGain();
                out.gain.value = CFG.soundVolume;
                master.connect(out).connect(actx.destination);
                noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
                const d = noiseBuf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            if (actx.state !== 'running') actx.resume();
            hint.style.opacity = 0;
        }
        ['pointerdown', 'keydown', 'touchstart'].forEach((e) => addEventListener(e, initAudio, { passive: true }));

        function playSquish(s) {
            if (!actx || actx.state !== 'running') return;
            const t = actx.currentTime;
            const vol = 0.25 + 0.75 * s;
            const pitch = 0.85 + Math.random() * 0.3;

            // 1) dumpfer Aufprall (Thump)
            const o1 = actx.createOscillator(), g1 = actx.createGain();
            o1.type = 'sine';
            o1.frequency.setValueAtTime(190 * pitch, t);
            o1.frequency.exponentialRampToValueAtTime(55, t + 0.14);
            g1.gain.setValueAtTime(0.0001, t);
            g1.gain.exponentialRampToValueAtTime(0.9 * vol, t + 0.005);
            g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
            o1.connect(g1).connect(master);
            o1.start(t); o1.stop(t + 0.22);

            // 2) Wackelpudding-"Boing": Ton mit schnellem Vibrato, der ausschwingt
            const o2 = actx.createOscillator(), g2 = actx.createGain();
            const lfo = actx.createOscillator(), lfoG = actx.createGain();
            o2.type = 'triangle';
            const f = (140 + 80 * (1 - s)) * pitch;
            o2.frequency.setValueAtTime(f * 1.5, t);
            o2.frequency.exponentialRampToValueAtTime(f, t + 0.08);
            lfo.frequency.setValueAtTime(11, t);
            lfo.frequency.linearRampToValueAtTime(6, t + 0.6);
            lfoG.gain.setValueAtTime(f * 0.18, t);
            lfoG.gain.exponentialRampToValueAtTime(1, t + 0.6);
            lfo.connect(lfoG).connect(o2.frequency);
            g2.gain.setValueAtTime(0.0001, t);
            g2.gain.exponentialRampToValueAtTime(0.35 * vol, t + 0.02);
            g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.35 + 0.35 * s);
            const lp = actx.createBiquadFilter();
            lp.type = 'lowpass'; lp.frequency.value = 900;
            o2.connect(g2).connect(lp).connect(master);
            o2.start(t); lfo.start(t);
            o2.stop(t + 0.75); lfo.stop(t + 0.75);

            // 3) nasser Squelch (gefiltertes Rauschen mit Sweep)
            const n = actx.createBufferSource(), bp = actx.createBiquadFilter(), g3 = actx.createGain();
            n.buffer = noiseBuf;
            bp.type = 'bandpass'; bp.Q.value = 3.5;
            bp.frequency.setValueAtTime(1600 * pitch, t);
            bp.frequency.exponentialRampToValueAtTime(280, t + 0.13);
            g3.gain.setValueAtTime(0.0001, t);
            g3.gain.exponentialRampToValueAtTime(0.5 * vol, t + 0.008);
            g3.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
            n.connect(bp).connect(g3).connect(master);
            n.start(t, Math.random() * 0.3); n.stop(t + 0.16);
        }

        // ================== MODI: STEUERN / SCHIESSEN ==================
        let mode = 'steer';
        const ui = document.createElement('div');
        ui.innerHTML = `
            <button data-m="steer" title="Gurke mit dem Cursor steuern">🥒 Steuern</button>
            <button data-m="shoot" title="Mini-Gurken schießen (Taste M wechselt)">🎯 Schießen</button>`;
        ui.style.cssText = 'position:fixed;top:14px;right:14px;display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(128,128,128,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:10;cursor:pointer;user-select:none';
        const btnCss = 'border:0;border-radius:999px;padding:7px 13px;font:600 12px sans-serif;cursor:pointer;transition:background .2s,color .2s';
        ui.querySelectorAll('button').forEach((b) => {
            b.style.cssText = btnCss;
            b.addEventListener('pointerdown', (e) => { e.stopPropagation(); initAudio(); setMode(b.dataset.m); });
        });
        // Textur-Tausch: eigener Schalter, funktioniert in beiden Modi
        const sep = document.createElement('span');
        sep.style.cssText = 'width:1px;margin:5px 3px;background:rgba(128,128,128,.35)';
        const swapBtn = document.createElement('button');
        swapBtn.textContent = '🔄 Tausch';
        swapBtn.title = 'Texturen von Kopf und Gurke tauschen (Taste T)';
        swapBtn.style.cssText = btnCss + ';background:transparent;color:rgba(128,128,128,.95)';
        swapBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); initAudio(); toggleSwap(); });
        ui.append(sep, swapBtn);
        document.body.appendChild(ui);
        addEventListener('keydown', (e) => { if (e.key === 't' || e.key === 'T') toggleSwap(); });

        function setMode(m) {
            mode = m;
            ui.querySelectorAll('button[data-m]').forEach((b) => {
                const on = b.dataset.m === m;
                b.style.background = on ? 'rgba(255,255,255,.92)' : 'transparent';
                b.style.color = on ? '#222' : 'rgba(128,128,128,.95)';
            });
            container.style.cursor = m === 'shoot' ? 'crosshair' : 'none';
            pickle.root.visible = m === 'steer' && pickle.respawn <= 0;
            if (m === 'steer') {
                // große Gurke taucht beim Cursor wieder auf
                updateTarget();
                pickle.pos.copy(target).add(new THREE.Vector3(0, 0, 1.5));
                pickle.vel.set(0, 0, 0);
            }
            firing = false;
        }
        addEventListener('keydown', (e) => {
            if (e.key === 'm' || e.key === 'M') setMode(mode === 'steer' ? 'shoot' : 'steer');
        });

        // ================== MINI-GURKEN-GESCHOSSE ==================
        const shots = [];
        let firing = false, fireCooldown = 0;
        const sv1 = new THREE.Vector3(), sv2 = new THREE.Vector3(), sq = new THREE.Quaternion();

        addEventListener('pointerdown', (e) => {
            if (mode !== 'shoot' || e.button > 0) return;
            firing = true;
            fireCooldown = 0; // erster Schuss sofort
        });
        addEventListener('pointerup', () => { firing = false; });
        addEventListener('pointercancel', () => { firing = false; });
        addEventListener('blur', () => { firing = false; });

        function fireShot() {
            if (!pickleTemplate) return;
            raycaster.setFromCamera(ndc, camera);
            const dir = raycaster.ray.direction;

            // Zielpunkt: dort, wo der Cursor-Strahl die Ebene durch die Kopfmitte trifft
            const aim = sv1;
            raycaster.ray.intersectPlane(plane.set(sv2.set(0, 0, 1), 0), aim) || aim.copy(camera.position).addScaledVector(dir, 7);

            let s = shots.length >= CFG.maxShots ? shots.shift() : null;
            if (!s) {
                const mesh = pickleTemplate.clone();
                const root = new THREE.Group();
                root.add(mesh);
                scene.add(root);
                s = { root, pos: new THREE.Vector3(), vel: new THREE.Vector3(), axis: new THREE.Vector3(),
                      spin: new THREE.Vector3(), radius: 0, half: 0, age: 0, sq: { x: 0, v: 0 } };
            }
            const k = CFG.shotSize;
            s.radius = pickle.radius * k;
            s.half = pickle.half * k;
            s.root.scale.setScalar(k);
            s.root.visible = true;
            s.age = 0;
            s.sq.x = 0; s.sq.v = 0;
            s.spit = false;

            // Start knapp vor der Kamera, leicht unterhalb – wie aus der Hand geworfen
            s.pos.copy(camera.position).addScaledVector(dir, 2.8).add(sv2.set(0, -0.12, 0));
            const flight = s.pos.distanceTo(aim) / CFG.shotSpeed;
            aim.y += 0.5 * CFG.shotGravity * flight * flight;   // Fallen ausgleichen
            s.vel.copy(aim).sub(s.pos).normalize().multiplyScalar(CFG.shotSpeed);
            s.vel.x += (Math.random() - 0.5) * 0.6;
            s.vel.y += (Math.random() - 0.5) * 0.6;

            // fliegt mit der Spitze voran und dreht sich dabei
            s.axis.copy(s.vel).normalize();
            s.spin.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(4 + Math.random() * 6);
            shots.push(s);
            playShoot();
        }

        function stepShots(dt) {
            if (mode === 'shoot' && firing) {
                fireCooldown -= dt;
                if (fireCooldown <= 0) { fireShot(); fireCooldown += 1 / CFG.fireRate; }
            }
            for (let i = shots.length - 1; i >= 0; i--) {
                const s = shots[i];
                s.age += dt;
                s.vel.y -= (s.spit ? 2.5 : CFG.shotGravity) * dt;
                s.pos.addScaledVector(s.vel, dt);
                if (s.spit) {
                    // zurückgeschossene Gurke: trifft die große Gurke oder klatscht auf den Bildschirm
                    if (spitHit(s)) { scene.remove(s.root); shots.splice(i, 1); continue; }
                } else {
                    if (trySwallow(s)) { scene.remove(s.root); shots.splice(i, 1); continue; }
                    const hit = collide(s, CFG.shotMass, 3, CFG.shotBounce, (str) => { s.sq.v -= 14 * Math.min(1.5, str / 8); });
                    if (hit > 2) s.spin.multiplyScalar(1.6).add(sv1.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(8));
                }
                s.axis.applyAxisAngle(sv2.copy(s.spin).normalize(), s.spin.length() * dt).normalize();
                s.sq.v += (-700 * s.sq.x - 10 * s.sq.v) * dt;
                s.sq.x += s.sq.v * dt;

                if (s.age > CFG.shotLifetime || s.pos.y < -12) {
                    scene.remove(s.root);
                    shots.splice(i, 1);
                }
            }
        }

        function renderShots() {
            for (const s of shots) {
                s.root.position.copy(s.pos);
                s.root.quaternion.setFromUnitVectors(X, s.axis);
                const fade = THREE.MathUtils.clamp((CFG.shotLifetime - s.age) / 0.5, 0, 1); // am Ende schrumpfen
                const k = CFG.shotSize * fade;
                const p = THREE.MathUtils.clamp(s.sq.x, -0.45, 0.45);
                s.root.scale.set(k * (1 + p), k * (1 - p * 0.5), k * (1 - p * 0.5));
            }
        }

        // Plopp beim Abschießen
        function playShoot() {
            if (!actx || actx.state !== 'running') return;
            const t = actx.currentTime;
            const o = actx.createOscillator(), g = actx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(520 + Math.random() * 120, t);
            o.frequency.exponentialRampToValueAtTime(140, t + 0.07);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.35, t + 0.004);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
            o.connect(g).connect(master);
            o.start(t); o.stop(t + 0.1);

            const n = actx.createBufferSource(), hp = actx.createBiquadFilter(), g2 = actx.createGain();
            n.buffer = noiseBuf;
            hp.type = 'highpass'; hp.frequency.value = 2500;
            g2.gain.setValueAtTime(0.12, t);
            g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
            n.connect(hp).connect(g2).connect(master);
            n.start(t, Math.random() * 0.3); n.stop(t + 0.06);
        }

        // ================== MUND-VERHALTEN ==================
        const mv1 = new THREE.Vector3(), mv2 = new THREE.Vector3(), mAng = new THREE.Vector3();
        const mvA = new THREE.Vector3(), mvB = new THREE.Vector3();

        function updateMouthWorld() {
            const anchor = U.uAnchor.value;
            mv1.copy(mouth.restTop).addScaledVector(mouth.openDelta, 0.5 * mouth.x);  // Mitte der Öffnung
            const h = heightOf(mv1);
            mouth.world.copy(mv1).sub(anchor);
            rotateAA(mouth.world, angleAt(h, mAng), 1);
            mouth.world.add(anchor);
        }

        // Mini-Gurke im offenen Mund? -> schlucken
        function trySwallow(s) {
            if (!mouth.mesh || mouth.x < 0.35 || rage.phase) return false;
            if (s.pos.distanceTo(mouth.world) > CFG.mouthRadius * (0.6 + 0.4 * mouth.x)) return false;
            mouth.chew = 1.1;
            mouth.cooldown = 0.25;
            squash.v += 0.6;
            addWobble(mv2.copy(mouth.restTop), mv1.set(0, -0.6, -0.4));
            playGulp();
            addRage(1 / CFG.eatsToRage);
            return true;
        }

        // ================== RACHE: WUT-LEISTE & ZURÜCKSCHIESSEN ==================
        const rage = { level: 0, shown: 0, phase: null, timer: 0, fireCd: 0 };

        const rageUi = document.createElement('div');
        rageUi.innerHTML = '<span style="font-size:14px">😠</span><div style="flex:1;height:6px;border-radius:3px;background:rgba(128,128,128,.25);overflow:hidden"><div style="height:100%;width:0%;border-radius:3px"></div></div>';
        rageUi.style.cssText = 'position:fixed;top:54px;right:20px;width:150px;display:flex;align-items:center;gap:7px;pointer-events:none;z-index:10;transition:transform .1s';
        const rageFill = rageUi.querySelector('div > div');
        document.body.appendChild(rageUi);

        function addRage(x) {
            if (rage.phase) return;
            rage.level = Math.min(1, rage.level + x);
            if (rage.level >= 1) startRage();
        }

        function startRage() {
            rage.phase = 'charge';
            rage.timer = CFG.rageCharge;
            mouth.chew = 0; mouth.chomp = 0;
            playRumble();
        }

        function stepRage(dt) {
            if (!rage.phase) return;
            rage.timer -= dt;
            if (rage.phase === 'charge') {
                // Kopf lehnt sich zurück und bebt
                head.tiltVel.x -= 1.2 * dt;
                head.tiltVel.x += (Math.random() - 0.5) * 30 * dt;
                head.tiltVel.z += (Math.random() - 0.5) * 30 * dt;
                shake = Math.max(shake, 0.02);
                if (rage.timer <= 0) { rage.phase = 'fire'; rage.timer = CFG.rageDuration; rage.fireCd = 0; }
            } else if (rage.phase === 'fire') {
                rage.fireCd -= dt;
                if (rage.fireCd <= 0) { spit(); rage.fireCd += 1 / CFG.rageFireRate; }
                rage.level = Math.max(0, rage.timer / CFG.rageDuration);
                if (rage.timer <= 0) { rage.phase = null; rage.level = 0; mouth.cooldown = 0.8; }
            }
        }

        // Mundöffnung während der Rache (wird von stepMouth abgefragt)
        function rageMouthTarget(t) {
            if (rage.phase === 'charge') return 1;
            if (rage.phase === 'fire') return 0.85 + 0.15 * Math.sin(t * 40);
            return null;
        }

        function spit() {
            if (!pickleTemplate || !mouth.mesh) return;
            const mesh = pickleTemplate.clone();
            const root = new THREE.Group();
            root.add(mesh);
            scene.add(root);
            const k = CFG.shotSize;
            const s = { root, pos: new THREE.Vector3(), vel: new THREE.Vector3(), axis: new THREE.Vector3(), spin: new THREE.Vector3(),
                        radius: pickle.radius * k, half: pickle.half * k, age: 0, sq: { x: 0, v: 0 }, spit: true };
            root.scale.setScalar(k);
            s.pos.copy(mouth.world).add(sv2.set(0, 0, 0.15));

            // zielt auf dich: Punkt kurz vor der Kamera, in Richtung Cursor, mit Streuung
            raycaster.setFromCamera(ndc, camera);
            const aim = sv1.copy(camera.position).addScaledVector(raycaster.ray.direction, 1.0);
            aim.x += (Math.random() - 0.5) * 0.9;
            aim.y += (Math.random() - 0.5) * 0.6;
            s.vel.copy(aim).sub(s.pos).normalize().multiplyScalar(CFG.rageSpeed * (0.85 + Math.random() * 0.3));
            s.axis.copy(s.vel).normalize();
            s.spin.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(5 + Math.random() * 6);
            shots.push(s);
            if (shots.length > CFG.maxShots + 20) { const o = shots.shift(); scene.remove(o.root); }

            // Rückstoß im Kopf
            head.tiltVel.x -= 0.25;
            squash.v -= 0.5;
            addWobble(sv2.copy(mouth.restTop), sv1.set(0, 0.1, 0.35));
            playSpit();
        }

        function spitHit(s) {
            // trifft die große Gurke?
            if (mode === 'steer' && pickle.respawn <= 0 && s.pos.distanceTo(pickle.pos) < pickle.radius + 0.35) {
                pickle.vel.addScaledVector(s.vel, 0.35);
                pSquash.v -= CFG.pickleSquash * 20;
                spawnCrumbs(s.pos, 4);
                playSquish(0.5);
                return true;
            }
            // erreicht die Kamera -> trifft dich (Wackler + Platsch-Sound, keine Kleckse)
            if (s.pos.z > camera.position.z - 1.4) {
                shake = Math.max(shake, 0.05);
                playSquish(0.8);
                return true;
            }
            return s.age > 3;
        }

        function renderRage(dt) {
            rage.shown += (rage.level - rage.shown) * Math.min(1, 8 * dt);
            rageFill.style.width = (rage.shown * 100).toFixed(1) + '%';
            const hue = 100 - rage.shown * 100; // grün -> rot
            rageFill.style.background = `hsl(${hue}, 75%, 50%)`;
            rageUi.style.transform = rage.phase ? `translate(${(Math.random() - 0.5) * 4}px, ${(Math.random() - 0.5) * 4}px)` : '';
        }

        // Sounds der Rache
        function playRumble() {
            if (!actx || actx.state !== 'running') return;
            const t = actx.currentTime, d = CFG.rageCharge;
            const o = actx.createOscillator(), g = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(55, t);
            o.frequency.exponentialRampToValueAtTime(150, t + d);
            lfo.frequency.value = 18; lg.gain.value = 0.25;
            const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.35, t + d * 0.8);
            g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.1);
            lfo.connect(lg).connect(g.gain);
            o.connect(lp).connect(g).connect(master);
            o.start(t); lfo.start(t); o.stop(t + d + 0.15); lfo.stop(t + d + 0.15);
        }
        function playSpit() {
            if (!actx || actx.state !== 'running') return;
            const t = actx.currentTime;
            const o = actx.createOscillator(), g = actx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(160 + Math.random() * 40, t);
            o.frequency.exponentialRampToValueAtTime(420, t + 0.06);   // "ptui" – steigt statt fällt
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
            o.connect(g).connect(master);
            o.start(t); o.stop(t + 0.12);
            const n = actx.createBufferSource(), bp = actx.createBiquadFilter(), g2 = actx.createGain();
            n.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 2;
            g2.gain.setValueAtTime(0.25, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
            n.connect(bp).connect(g2).connect(master);
            n.start(t, Math.random() * 0.3); n.stop(t + 0.08);
        }

        function stepMouth(dt, t) {
            if (!mouth.mesh) return;
            updateMouthWorld();
            mouth.cooldown = Math.max(0, mouth.cooldown - dt);
            mouth.oh *= Math.exp(-3.5 * dt);

            // Vorfreude: Gurke(n) in der Nähe des Mundes?
            let want = 0;
            if (mode === 'steer') {
                // nächstes Gurken-Ende zum Mund (angebissene Enden berücksichtigt)
                // Abstand Mund -> nächster Punkt auf der (Rest-)Gurke
                let dmin = Infinity, endSign = 1;
                if (pickle.respawn <= 0) {
                    // so gemessen, wie man es auf dem Bildschirm sieht: Gurke auf die Mund-Ebene projizieren
                    const [eN, eP] = pickleEnds();
                    const cam = camera.position, mz = mouth.world.z;
                    const proj = (p, out) => out.copy(p).sub(cam).multiplyScalar((mz - cam.z) / (p.z - cam.z)).add(cam);
                    const A = proj(mv1.copy(pickle.pos).addScaledVector(pickle.axis, eN), mvA);
                    const B = proj(mv1.copy(pickle.pos).addScaledVector(pickle.axis, eP), mvB);
                    mv2.copy(B).sub(A);
                    const u = THREE.MathUtils.clamp(mv1.copy(mouth.world).sub(A).dot(mv2) / Math.max(mv2.lengthSq(), 1e-6), 0, 1);
                    const tm = eN + u * (eP - eN);
                    const C = mv1.copy(A).addScaledVector(mv2, u);
                    const P3 = mv2.copy(pickle.pos).addScaledVector(pickle.axis, tm);
                    const scale = (mz - cam.z) / (P3.z - cam.z);
                    dmin = C.distanceTo(mouth.world) - pickle.radius * scale;
                    if (P3.z - mz > 1.1) dmin += 10;          // zu weit vor dem Gesicht = kein Biss
                    endSign = u >= 0.5 ? 1 : -1;              // abgebissen wird das Ende auf der Mund-Seite
                    mouth.biteT = tm;
                }
                const inFront = pickle.pos.z > mouth.world.z - 0.3;
                if (inFront) want = THREE.MathUtils.clamp((CFG.mouthReach - dmin) / (CFG.mouthReach - 0.4), 0, 1);

                // Zuschnappen + abbeißen, wenn die Gurke im offenen Mund ist
                if (dmin < CFG.mouthRadius && mouth.x > 0.55 && mouth.cooldown === 0 && inFront && !rage.phase) chomp(endSign);
            } else {
                for (const s of shots) {
                    mv1.copy(mouth.world).sub(s.pos);
                    const dist = mv1.length();
                    if (dist < 3.5 && s.vel.dot(mv1) > 0.6 * s.vel.length() * dist) want = Math.max(want, 1 - dist / 3.5 + 0.35);
                }
                want = Math.min(1, want);
            }
            mouth.want += (want - mouth.want) * Math.min(1, 6 * dt);

            // Zielöffnung
            let target = Math.max(mouth.want, mouth.oh);
            let k = 160, c = 9;                                     // weich & wabbelig
            if (mouth.chomp > 0) { mouth.chomp -= dt; target = 0; k = 1400; c = 30; }   // zack zu
            else if (mouth.chew > 0) {
                mouth.chew -= dt;
                target = 0.08 + 0.22 * (0.5 + 0.5 * Math.sin(t * 17));   // mampf mampf
                k = 900; c = 25;
            }
            const rt = rageMouthTarget(t);
            if (rt !== null) { target = rt; k = 700; c = 20; }        // Rache: Mund weit auf
            target = Math.min(target, 1) * CFG.mouthMaxOpen;
            mouth.v += (k * (target - mouth.x) - c * mouth.v) * dt;
            mouth.x = THREE.MathUtils.clamp(mouth.x + mouth.v * dt, 0, 1.05);
        }

        function chomp(endSign = 1) {
            mouth.chomp = 0.3;
            mouth.cooldown = 1.1;
            mouth.want = 0;

            // --- Stück abbeißen ---
            const [eN, eP] = pickleEnds();
            // Biss setzt dort an, wo die Gurke im Mund steckt (mind. halbe, max. doppelte biteSize)
            const tm = mouth.biteT ?? (endSign > 0 ? eP : eN);
            if (endSign > 0) pickle.cutP = THREE.MathUtils.clamp(tm, eP - CFG.biteSize * 2, eP - CFG.biteSize * 0.5);
            else pickle.cutN = THREE.MathUtils.clamp(tm, eN + CFG.biteSize * 0.5, eN + CFG.biteSize * 2);
            mv2.copy(pickle.pos).addScaledVector(pickle.axis, endSign > 0 ? pickle.cutP : pickle.cutN);   // Bissstelle (für Krümel)
            const [nN, nP] = pickleEnds();
            spawnCrumbs(mv2, 7);

            if (nP - nN < CFG.biteSize * 1.1) {
                // ganz aufgegessen -> schlucken, gleich kommt eine neue
                pickle.respawn = 1.3;
                pickle.root.visible = false;
                mouth.chew = 1.4;
                setTimeout(playGulp, 900);
            } else {
                mouth.chew = 1.0;
                // Rest der Gurke wird etwas zurückgerissen
                mv1.copy(pickle.pos).sub(mouth.world).setZ(Math.abs(pickle.pos.z - mouth.world.z) + 0.6).normalize();
                pickle.vel.addScaledVector(mv1, 4);
                pSquash.v -= CFG.pickleSquash * 18;
            }
            squash.v += 1.2;
            addWobble(mv1.copy(mouth.restTop), mv2.set(0, 0.5, -0.3));
            addRage(1 / CFG.eatsToRage);
            shake = Math.max(shake, CFG.cameraShake * 0.6);
            playChomp();
        }

        // --- Krümel ---
        const crumbs = [];
        const crumbGeo = new THREE.IcosahedronGeometry(0.035, 0);
        const crumbMats = [new THREE.MeshStandardMaterial({ color: 0xd9e89a, roughness: 0.6 }),
                           new THREE.MeshStandardMaterial({ color: 0x4f7a22, roughness: 0.6 })];
        function spawnCrumbs(at, n) {
            for (let i = 0; i < n; i++) {
                const m = new THREE.Mesh(crumbGeo, crumbMats[i % 2]);
                m.position.copy(at);
                m.scale.setScalar(0.6 + Math.random() * 1.2);
                scene.add(m);
                crumbs.push({ m, vel: new THREE.Vector3((Math.random() - 0.5) * 3, 1 + Math.random() * 2.5, 0.5 + Math.random() * 2), age: 0,
                              spin: new THREE.Vector3(Math.random(), Math.random(), Math.random()).multiplyScalar(12) });
            }
        }
        function stepCrumbs(dt) {
            for (let i = crumbs.length - 1; i >= 0; i--) {
                const c = crumbs[i];
                c.age += dt;
                c.vel.y -= 9 * dt;
                c.m.position.addScaledVector(c.vel, dt);
                c.m.rotation.x += c.spin.x * dt; c.m.rotation.y += c.spin.y * dt;
                if (c.age > 1.4) { scene.remove(c.m); crumbs.splice(i, 1); }
            }
        }

        // Mampf-Geräusche
        function playChomp() {
            if (!actx || actx.state !== 'running') return;
            const t = actx.currentTime;
            for (let k = 0; k < 3; k++) {                       // knackiges Crunch
                const n = actx.createBufferSource(), bp = actx.createBiquadFilter(), g = actx.createGain();
                const tk = t + k * 0.025 + Math.random() * 0.01;
                n.buffer = noiseBuf;
                bp.type = 'bandpass'; bp.Q.value = 1.5; bp.frequency.value = 2200 + Math.random() * 1800;
                g.gain.setValueAtTime(0.0001, tk);
                g.gain.exponentialRampToValueAtTime(0.45, tk + 0.003);
                g.gain.exponentialRampToValueAtTime(0.0001, tk + 0.05);
                n.connect(bp).connect(g).connect(master);
                n.start(tk, Math.random() * 0.4); n.stop(tk + 0.06);
            }
            const o = actx.createOscillator(), g2 = actx.createGain();     // Zähne-Klack
            o.type = 'square';
            o.frequency.setValueAtTime(320, t);
            o.frequency.exponentialRampToValueAtTime(90, t + 0.04);
            g2.gain.setValueAtTime(0.2, t);
            g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
            o.connect(g2).connect(master);
            o.start(t); o.stop(t + 0.07);
        }

        function playGulp() {
            if (!actx || actx.state !== 'running') return;
            const t = actx.currentTime + 0.05;
            const o = actx.createOscillator(), g = actx.createGain(), lp = actx.createBiquadFilter();
            o.type = 'sine';
            o.frequency.setValueAtTime(420, t);
            o.frequency.exponentialRampToValueAtTime(90, t + 0.16);
            lp.type = 'lowpass'; lp.frequency.value = 700;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
            o.connect(lp).connect(g).connect(master);
            o.start(t); o.stop(t + 0.25);
        }

        // ================== PHYSIK ==================
        const v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), v3 = new THREE.Vector3();
        const rest = new THREE.Vector3(), nW = new THREE.Vector3(), arm = new THREE.Vector3();
        const ang = new THREE.Vector3(), omega = new THREE.Vector3(), surfV = new THREE.Vector3();
        const best = { pen: 0, n: new THREE.Vector3(), p: new THREE.Vector3(), rest: new THREE.Vector3(), h: 0 };
        const tiltPrevVel = new THREE.Vector3();
        // Kollisionskörper für die große Gurke (teilt Geschwindigkeit & Achse, eigene Mitte/Länge)
        const pickleProxy = { pos: new THREE.Vector3(), vel: pickle.vel, axis: pickle.axis, radius: 0.22, half: 0.45 };
        const desiredAxis = new THREE.Vector3(1, 0, 0);
        const SAMPLES = 9;

        // tiefster Eindring-Punkt einer Gurke in den (verbogenen) Kopf
        function findContact(body, samples = SAMPLES) {
            best.pen = 0;
            const anchor = U.uAnchor.value;
            for (let i = 0; i < samples; i++) {
                const f = samples > 1 ? (i / (samples - 1)) * 2 - 1 : 0;
                const p = v1.copy(body.pos).addScaledVector(body.axis, f * body.half);

                // Weltpunkt -> Ruhelage des Kopfes (Biegung rückgängig machen, 2 Iterationen)
                let h = heightOf(p);
                for (let it = 0; it < 2; it++) {
                    rest.copy(p).sub(anchor);
                    rotateAA(rest, angleAt(h, ang), -1);
                    rest.add(anchor);
                    h = heightOf(rest);
                }
                // Ellipsoid-Test in Ruhelage
                const rel = v2.copy(rest).sub(head.center);
                const q = v3.set(rel.x / head.axes.x, rel.y / head.axes.y, rel.z / head.axes.z);
                const s = Math.max(q.length(), 1e-4);
                const dist = (s - 1) * rel.length() / s;
                const pen = body.radius - dist;
                if (pen > best.pen) {
                    best.pen = pen;
                    best.h = h;
                    best.rest.copy(rest);
                    // Normale in Ruhelage -> Welt
                    best.n.set(q.x / head.axes.x, q.y / head.axes.y, q.z / head.axes.z).normalize();
                    rotateAA(best.n, angleAt(h, ang), 1);
                    best.p.copy(p).addScaledVector(best.n, -body.radius); // Kontaktpunkt
                }
            }
            return best.pen > 0;
        }

        // Gurke (beliebiger Größe/Masse) gegen den Kopf auflösen. Gibt die Aufprallgeschwindigkeit zurück.
        function collide(body, mass, samples, bounce, onHit) {
            if (!head.ready) return 0;
            const anchor = U.uAnchor.value;
            let hitSpeed = 0;
            for (let iter = 0; iter < 3 && findContact(body, samples); iter++) {
                const n = best.n, h = best.h;
                // 1) rausschieben – die Gurke kommt NIE in den Kopf
                body.pos.addScaledVector(n, best.pen);

                // 2) Impuls zwischen Gurke und kippendem Kopf
                arm.copy(best.p).sub(anchor);
                const sH = bendS(h);
                omega.copy(head.tiltVel).multiplyScalar(sH);
                surfV.crossVectors(omega, arm);
                const vRel = v2.copy(body.vel).sub(surfV);
                const vn = vRel.dot(n);
                if (vn >= 0) continue;

                const rxn = v3.crossVectors(arm, n);
                const invHead = sH * sH * rxn.lengthSq() / CFG.headInertia;
                const j = -(1 + bounce) * vn / (1 / mass + invHead);
                body.vel.addScaledVector(n, j / mass);
                head.tiltVel.addScaledVector(rxn, -j * sH / CFG.headInertia);

                // Reibung: Streifen nimmt den Kopf ein bisschen mit
                const vt = vRel.addScaledVector(n, -vn);
                const jt = vt.multiplyScalar(-0.25 / (1 / mass + invHead));
                body.vel.addScaledVector(jt, 1 / mass);
                head.tiltVel.addScaledVector(v3.crossVectors(arm, jt), -sH / CFG.headInertia);

                // Wackelpudding an der Trefferstelle (skaliert mit dem Impuls)
                const strength = Math.min(-vn, 30) * Math.min(1, mass * 1.6);
                if (strength > 0.3) {
                    addWobble(best.rest, v1.copy(n).multiplyScalar(-strength * CFG.wobbleGain));
                    U.uSqDir.value.lerp(v1.copy(n).negate(), 0.5).normalize();
                    squash.v += Math.min(strength, 15) * CFG.squashGain * (0.4 + Math.abs(n.y));
                }
                // spürbarer Treffer: Welle + Kamera + Sound
                if (strength > 1.2) { impact(best.rest, strength); if (onHit) onHit(strength); }
                hitSpeed = Math.max(hitSpeed, -vn);
            }
            return hitSpeed;
        }

        function step(dt, t) {
            // --- aufgegessen? neue Gurke kommt ---
            if (pickle.respawn > 0) {
                pickle.respawn -= dt;
                if (pickle.respawn <= 0) {
                    pickle.cutP = 10; pickle.cutN = -10;
                    pickle.pos.copy(target).add(v1.set(0, 0, 1.2));
                    pickle.vel.set(0, 0, 0);
                    pickle.grow = 0; pickle.growV = 0;
                    pickle.root.visible = mode === 'steer';
                }
            }
            pickle.growV += (300 * (1 - pickle.grow) - 14 * pickle.growV) * dt;   // "plopp", mit Überschwinger
            pickle.grow += pickle.growV * dt;

            if (mode === 'steer' && pickle.respawn <= 0) {
                // --- Gurke folgt dem Cursor (gedämpfte Feder); der übrige Rest hängt am Cursor ---
                const [eN0, eP0] = pickleEnds();
                const k = CFG.followStiffness;
                const c = 2 * Math.sqrt(k) * CFG.followDamping;
                v1.copy(target).addScaledVector(pickle.axis, -(eN0 + eP0) / 2).sub(pickle.pos).multiplyScalar(k).addScaledVector(pickle.vel, -c);
                pickle.vel.addScaledVector(v1, dt);
                if (pickle.vel.length() > 30) pickle.vel.setLength(30);
                pickle.pos.addScaledVector(pickle.vel, dt);

                // Kollision mit dem (evtl. angebissenen) Rest der Gurke
                const [eN, eP] = pickleEnds();
                const mid = (eN + eP) / 2;
                pickleProxy.pos.copy(pickle.pos).addScaledVector(pickle.axis, mid);
                pickleProxy.half = Math.max(0.01, (eP - eN) / 2 - pickle.radius * 0.8);
                pickleProxy.radius = pickle.radius;
                collide(pickleProxy, 1, SAMPLES, CFG.bounce, (s) => { pSquash.v -= CFG.pickleSquash * 22 * (0.3 + Math.min(1, s / 10)); });
                pickle.pos.copy(pickleProxy.pos).addScaledVector(pickle.axis, -mid);
            }

            stepShots(dt);
            stepCrumbs(dt);
            stepMouth(dt, t);
            stepRage(dt);

            // --- Punchingball-Feder (kippt um den festen Punkt unten) ---
            tiltPrevVel.copy(head.tiltVel);
            v1.set(Math.sin(t * 0.5) * 0.015, Math.sin(t * 0.37) * 0.04, Math.sin(t * 0.43) * 0.02); // leichtes Schweben
            v1.sub(head.tilt).multiplyScalar(CFG.headStiffness);
            head.tiltVel.addScaledVector(v1, dt);
            head.tiltVel.multiplyScalar(Math.max(0, 1 - CFG.headDamping * dt));
            head.tilt.addScaledVector(head.tiltVel, dt);
            if (head.tilt.length() > CFG.maxTilt) {
                head.tilt.setLength(CFG.maxTilt);
                const out = head.tiltVel.dot(v1.copy(head.tilt).normalize());
                if (out > 0) head.tiltVel.addScaledVector(v1, -out * 1.3);
            }

            // --- Nachschwingen oben: getrieben von der Kipp-Beschleunigung ---
            v1.copy(head.tiltVel).sub(tiltPrevVel);
            head.whipVel.addScaledVector(v1, -CFG.whipGain * 30);
            head.whipVel.addScaledVector(head.whip, -CFG.whipStiffness * dt);
            head.whipVel.multiplyScalar(Math.max(0, 1 - CFG.whipDamping * dt));
            head.whip.addScaledVector(head.whipVel, dt);
            if (head.whip.length() > 0.45) head.whip.setLength(0.45);

            // --- lokale Wabbel-Federn & Stauchen ---
            for (const w of wob) {
                w.v.addScaledVector(w.d, -CFG.wobbleStiffness * dt);
                w.v.multiplyScalar(Math.max(0, 1 - CFG.wobbleDamping * dt));
                w.d.addScaledVector(w.v, dt);
                if (w.d.length() > 0.5) w.d.setLength(0.5);
            }
            squash.v += -CFG.wobbleStiffness * 1.2 * squash.x * dt;
            squash.v *= Math.max(0, 1 - CFG.squashDamping * dt);
            squash.x = THREE.MathUtils.clamp(squash.x + squash.v * dt, -0.22, 0.22);
            U.uSq.value = squash.x;

            // Wellen altern
            for (let i = 0; i < NRIP; i++) U.uRipT.value[i] += dt;

            // Gurken-Squash-Feder
            pSquash.v += (-600 * pSquash.x - 9 * pSquash.v) * dt;
            pSquash.x += pSquash.v * dt;
            shake *= Math.max(0, 1 - 9 * dt);

            // --- Gurke ausrichten: Spitze zeigt in Bewegungsrichtung ---
            const sp = pickle.vel.length();
            if (sp > 0.6) {
                v1.copy(pickle.vel).divideScalar(sp);
                if (v1.dot(desiredAxis) < 0 && sp < 4) v1.negate();
                desiredAxis.lerp(v1, Math.min(1, sp * 0.6 * dt)).normalize();
            } else {
                v1.set(Math.cos(t * 0.7), Math.sin(t * 0.9) * 0.35, Math.sin(t * 0.5) * 0.3).normalize();
                desiredAxis.lerp(v1, 0.6 * dt).normalize();
            }
            pickle.axis.lerp(desiredAxis, Math.min(1, 10 * dt)).normalize();
        }

        // ================== LOOP ==================
        const clock = new THREE.Clock();
        const X = new THREE.Vector3(1, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 1 / 30);
            const t = clock.elapsedTime;

            updateTarget();
            const sub = 4;
            for (let i = 0; i < sub; i++) step(dt / sub, t);

            pickle.root.position.copy(pickle.pos);
            pickle.root.quaternion.setFromUnitVectors(X, pickle.axis);
            const ps = THREE.MathUtils.clamp(pSquash.x, -0.45, 0.45);
            const gr = Math.max(0.001, pickle.grow);
            pickle.root.scale.set((1 + ps) * gr, (1 - ps * 0.5) * gr, (1 - ps * 0.5) * gr);

            // Biss-Uniforms (Schnittkanten skalieren mit der Gurke mit)
            BITE.uBC.value.copy(pickle.pos);
            BITE.uBA.value.copy(pickle.axis);
            BITE.uBP.value.set(0, 1, 0).applyQuaternion(pickle.root.quaternion);
            BITE.uCutP.value = pickle.cutP * (1 + ps) * gr;
            BITE.uCutN.value = pickle.cutN * (1 + ps) * gr;
            BITE.uTooth.value = 0.07 * gr;

            camera.position.set((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake, 7);

            renderShots();
            renderRage(dt);
            if (mouth.mesh) for (const m of mouth.meshes) m.morphTargetInfluences[m.morphTargetDictionary['MundAuf']] = mouth.x;

            U.uCapR.value = pickle.radius * 1.05;
            if (mode === 'steer' && pickle.respawn <= 0) {
                const [eN, eP] = pickleEnds();
                const r = pickle.radius * 0.8;
                U.uSegA.value.copy(pickle.pos).addScaledVector(pickle.axis, Math.min(eN + r, (eN + eP) / 2) * gr);
                U.uSegB.value.copy(pickle.pos).addScaledVector(pickle.axis, Math.max(eP - r, (eN + eP) / 2) * gr);
                U.uCapR.value = pickle.radius * 1.05 * gr;
            } else {
                U.uSegA.value.set(100, 100, 100); U.uSegB.value.set(100, 100, 101);
            }

            renderer.render(scene, camera);
        }
        setMode('steer');
        animate();

        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>

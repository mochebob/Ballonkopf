<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballonkopf</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: transparent;
            overflow: hidden;
            height: 100%;
            touch-action: none;
        }
        #scene-container {
            position: fixed;
            inset: 0;
            cursor: none; /* die Gurke IST der Cursor */
        }
        canvas { display: block; outline: none; }
        .loading {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="scene-container">
        <div class="loading">Lädt...</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // ================== EINSTELLUNGEN ==================
        const CFG = {
            headHeight: 4.6,        // Kopfgröße (Höhe in Welt-Einheiten) – groß in der Mitte
            pickleLength: 1.35,     // Gurkenlänge
            followStiffness: 220,   // wie straff die Gurke am Cursor hängt
            followDamping: 0.75,    // 1 = keine Überschwinger, kleiner = federnder

            // Punchingball (Kopf kippt um den festen Punkt unten)
            headInertia: 18,        // "Gewicht" des Kopfes – höher = schwerer zu schubsen
            headStiffness: 60,      // Rückstellfeder – höher = schneller zurück
            headDamping: 1.4,       // wie schnell das Schaukeln abklingt
            maxTilt: 0.6,           // maximales Kippen (Radiant)
            neckBend: 0.24,         // Anteil der Höhe, der sich biegt (der Rest kippt starr)
            bounce: 0.35,           // wie stark die Gurke abprallt (0–1)

            // Wackelpudding obendrauf
            whipGain: 0.035,        // Nachschwingen der oberen Kopfhälfte
            whipStiffness: 420,
            whipDamping: 5,
            wobbleGain: 0.10,       // lokales Wabbeln an der Trefferstelle
            wobbleStiffness: 300,
            wobbleDamping: 5,
            wobbleRadius: 1.0,
            squashGain: 0.012,      // Stauchen bei Treffern von oben/frontal
        };

        // ================== SZENE ==================
        const container = document.getElementById('scene-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
        camera.position.set(0, 0, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        new RGBELoader().load(
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr',
            (tex) => { tex.mapping = THREE.EquirectangularReflectionMapping; scene.environment = tex; },
            undefined,
            () => {
                scene.add(new THREE.AmbientLight(0xffffff, 0.8));
                const d = new THREE.DirectionalLight(0xffffff, 0.8);
                d.position.set(2, 2, 3);
                scene.add(d);
            }
        );

        // ================== VERFORMUNGS-SHADER (GPU) ==================
        const NWOB = 6;
        const U = {
            uAnchor: { value: new THREE.Vector3(0, -2.3, 0) }, // fester Punkt unten
            uH:      { value: 4.6 },
            uBend:   { value: CFG.neckBend },
            uTilt:   { value: new THREE.Vector3() },  // Kipp-Rotation (Achse·Winkel)
            uWhip:   { value: new THREE.Vector3() },  // Nachschwingen oben
            uWobC:   { value: Array.from({ length: NWOB }, () => new THREE.Vector3()) },
            uWobD:   { value: Array.from({ length: NWOB }, () => new THREE.Vector3()) },
            uWobS2:  { value: CFG.wobbleRadius ** 2 },
            uSqDir:  { value: new THREE.Vector3(0, 1, 0) },
            uSq:     { value: 0 },
            uSegA:   { value: new THREE.Vector3(100, 100, 100) },
            uSegB:   { value: new THREE.Vector3(100, 100, 101) },
            uCapR:   { value: 0.2 },
        };

        const GLSL = /* glsl */`
            uniform vec3 uAnchor, uTilt, uWhip, uSqDir, uSegA, uSegB;
            uniform float uH, uBend, uSq, uWobS2, uCapR;
            uniform vec3 uWobC[${NWOB}];
            uniform vec3 uWobD[${NWOB}];

            vec3 rotAA(vec3 v, vec3 aa) {          // Rodrigues: Rotation um Achse·Winkel
                float a = length(aa);
                if (a < 1e-6) return v;
                vec3 k = aa / a;
                return v * cos(a) + cross(k, v) * sin(a) + k * dot(k, v) * (1.0 - cos(a));
            }

            vec3 deform(vec3 p) {
                vec3 r = p - uAnchor;
                float h = clamp(r.y / uH, 0.0, 1.0);   // 0 = unten (fest), 1 = Scheitel
                float fix = smoothstep(0.0, 0.18, h);

                // Stauchen (Boden bleibt stehen)
                float a = dot(r, uSqDir);
                vec3 perp = r - uSqDir * a;
                r = mix(r, uSqDir * a * (1.0 - uSq) + perp * (1.0 + 0.5 * uSq), fix);

                // lokales Wabbeln an Trefferstellen
                vec3 o = vec3(0.0);
                for (int i = 0; i < ${NWOB}; i++) {
                    vec3 d = (uAnchor + r) - uWobC[i];
                    o += uWobD[i] * exp(-dot(d, d) / uWobS2);
                }
                r += o * fix;

                // Punchingball: Hals biegt sich, Kopf kippt; oben schwingt's nach
                float s = smoothstep(0.0, uBend, h);
                r = rotAA(r, uTilt * s + uWhip * h * h * h);
                vec3 q = uAnchor + r;

                // kleine Ausweich-Delle (nur damit Nase & Co nicht durch die Gurke stechen)
                vec3 ab = uSegB - uSegA;
                float t = clamp(dot(q - uSegA, ab) / max(dot(ab, ab), 1e-6), 0.0, 1.0);
                vec3 dv = q - (uSegA + ab * t);
                float dl = length(dv);
                float k = max(0.0, 1.0 - dl / (1.5 * uCapR));
                q += (dl > 1e-4 ? dv / dl : vec3(0.0, 0.0, 1.0)) * uCapR * k * k;
                return q;
            }
        `;

        function makeJelly(material) {
            material.onBeforeCompile = (shader) => {
                Object.assign(shader.uniforms, U);
                shader.vertexShader = shader.vertexShader
                    .replace('#include <common>', '#include <common>\n' + GLSL)
                    .replace('#include <project_vertex>', /* glsl */`
                        vec3 jP = (modelMatrix * vec4(transformed, 1.0)).xyz;
                        vec3 jN = normalize(mat3(modelMatrix) * objectNormal);
                        vec3 jT = normalize(cross(jN, abs(jN.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
                        vec3 jB = cross(jN, jT);
                        const float jE = 0.02;
                        vec3 j0 = deform(jP);
                        vec3 j1 = deform(jP + jT * jE);
                        vec3 j2 = deform(jP + jB * jE);
                        vec3 jNN = normalize(cross(j1 - j0, j2 - j0));
                        if (dot(jNN, rotAA(jN, uTilt)) < 0.0) jNN = -jNN;
                        #ifndef FLAT_SHADED
                            vNormal = normalize((viewMatrix * vec4(jNN, 0.0)).xyz);
                        #endif
                        vec4 mvPosition = viewMatrix * vec4(j0, 1.0);
                        gl_Position = projectionMatrix * mvPosition;
                    `);
            };
            material.customProgramCacheKey = () => 'jelly2';
            material.needsUpdate = true;
        }

        // ================== KOPF ==================
        const head = {
            root: new THREE.Group(),
            center: new THREE.Vector3(),          // Ellipsoid-Mitte (Ruhelage)
            axes: new THREE.Vector3(1, 1.5, 1.2), // Ellipsoid-Halbachsen
            tilt: U.uTilt.value, tiltVel: new THREE.Vector3(),
            whip: U.uWhip.value, whipVel: new THREE.Vector3(),
            ready: false,
        };
        scene.add(head.root);

        function setupHead(model) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const s = CFG.headHeight / size.y;
            model.scale.setScalar(s);
            model.position.copy(center).multiplyScalar(-s);
            head.root.add(model);

            head.axes.copy(size).multiplyScalar(0.5 * s * 0.92);
            head.center.set(0, 0, 0);
            U.uH.value = CFG.headHeight;
            U.uAnchor.value.set(0, -CFG.headHeight / 2, 0);

            model.traverse((c) => {
                if (c.isMesh) {
                    c.frustumCulled = false;
                    (Array.isArray(c.material) ? c.material : [c.material]).forEach(makeJelly);
                }
            });
            head.ready = true;
            document.querySelector('.loading').style.display = 'none';
        }

        new GLTFLoader().load('kopf.glb',
            (gltf) => setupHead(gltf.scene),
            undefined,
            () => {
                const g = new THREE.Group();
                g.add(new THREE.Mesh(
                    new THREE.SphereGeometry(1, 96, 96).scale(0.8, 1, 0.9),
                    new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.5, metalness: 0.3 })
                ));
                setupHead(g);
            }
        );

        // ================== GURKE ==================
        const pickle = {
            root: new THREE.Group(),
            pos: new THREE.Vector3(3.5, 0, 1),
            vel: new THREE.Vector3(),
            axis: new THREE.Vector3(1, 0, 0),
            radius: 0.22,
            half: 0.45,
        };
        scene.add(pickle.root);

        function setupPickle(model) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const inner = new THREE.Group();
            inner.add(model);
            model.position.sub(center);
            let len = size.x, thick = Math.max(size.y, size.z);
            if (size.y >= size.x && size.y >= size.z) { inner.rotation.z = Math.PI / 2; len = size.y; thick = Math.max(size.x, size.z); }
            else if (size.z >= size.x && size.z >= size.y) { inner.rotation.y = Math.PI / 2; len = size.z; thick = Math.max(size.x, size.y); }
            const s = CFG.pickleLength / len;
            inner.scale.setScalar(s);
            pickle.root.add(inner);
            pickle.radius = thick * s * 0.5;
            pickle.half = Math.max(0.01, CFG.pickleLength / 2 - pickle.radius);
        }

        new GLTFLoader().load('gurke.glb',
            (gltf) => setupPickle(gltf.scene),
            undefined,
            () => setupPickle(new THREE.Mesh(
                new THREE.CapsuleGeometry(0.22, 0.9, 8, 16).rotateZ(Math.PI / 2),
                new THREE.MeshStandardMaterial({ color: 0x3f8f2f, roughness: 0.6 })
            ))
        );

        // ================== CURSOR ==================
        const raycaster = new THREE.Raycaster();
        const ndc = new THREE.Vector2(0.7, 0);
        let planeZ = 0.8; // Mausrad: Gurke nach vorne/hinten
        const target = new THREE.Vector3(3.5, 0, planeZ);
        const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        function updateTarget() {
            raycaster.setFromCamera(ndc, camera);
            plane.constant = -planeZ;
            raycaster.ray.intersectPlane(plane, target);
        }
        const setNdc = (e) => ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
        addEventListener('pointermove', setNdc);
        addEventListener('pointerdown', setNdc);
        addEventListener('wheel', (e) => {
            planeZ = THREE.MathUtils.clamp(planeZ - e.deltaY * 0.002, -1.5, 2.5);
        }, { passive: true });

        // ================== HILFSFUNKTIONEN ==================
        const bendS = (h) => { const x = THREE.MathUtils.clamp(h / CFG.neckBend, 0, 1); return x * x * (3 - 2 * x); };
        const quat = new THREE.Quaternion();
        const aaTmp = new THREE.Vector3();

        function rotateAA(v, aa, sign = 1) {
            const a = aa.length();
            if (a < 1e-6) return v;
            quat.setFromAxisAngle(aaTmp.copy(aa).divideScalar(a), a * sign);
            return v.applyQuaternion(quat);
        }
        // Rotationsvektor (Achse·Winkel), der an Höhe h wirkt
        function angleAt(h, out) {
            return out.copy(head.tilt).multiplyScalar(bendS(h)).addScaledVector(head.whip, h * h * h);
        }
        const heightOf = (p) => THREE.MathUtils.clamp((p.y - U.uAnchor.value.y) / CFG.headHeight, 0, 1);

        // ================== JELLY-FEDERN ==================
        const wob = Array.from({ length: NWOB }, (_, i) => ({
            c: U.uWobC.value[i], d: U.uWobD.value[i], v: new THREE.Vector3(),
        }));
        const squash = { x: 0, v: 0 };

        function addWobble(restPoint, impulse) {
            let best = null, bestDist = Infinity;
            for (const w of wob) {
                const dist = w.c.distanceTo(restPoint);
                if (dist < bestDist) { bestDist = dist; best = w; }
            }
            if (bestDist > CFG.wobbleRadius * 0.6) {
                best = wob.reduce((a, b) => (a.d.lengthSq() + a.v.lengthSq() * 0.01 < b.d.lengthSq() + b.v.lengthSq() * 0.01 ? a : b));
                best.c.copy(restPoint);
            } else best.c.lerp(restPoint, 0.2);
            best.v.add(impulse);
        }

        // ================== PHYSIK ==================
        const v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), v3 = new THREE.Vector3();
        const rest = new THREE.Vector3(), nW = new THREE.Vector3(), arm = new THREE.Vector3();
        const ang = new THREE.Vector3(), omega = new THREE.Vector3(), surfV = new THREE.Vector3();
        const best = { pen: 0, n: new THREE.Vector3(), p: new THREE.Vector3(), rest: new THREE.Vector3(), h: 0 };
        const tiltPrevVel = new THREE.Vector3();
        const desiredAxis = new THREE.Vector3(1, 0, 0);
        const SAMPLES = 9;

        // tiefster Eindring-Punkt der Gurke in den (verbogenen) Kopf
        function findContact() {
            best.pen = 0;
            const anchor = U.uAnchor.value;
            for (let i = 0; i < SAMPLES; i++) {
                const f = (i / (SAMPLES - 1)) * 2 - 1;
                const p = v1.copy(pickle.pos).addScaledVector(pickle.axis, f * pickle.half);

                // Weltpunkt -> Ruhelage des Kopfes (Biegung rückgängig machen, 2 Iterationen)
                let h = heightOf(p);
                for (let it = 0; it < 2; it++) {
                    rest.copy(p).sub(anchor);
                    rotateAA(rest, angleAt(h, ang), -1);
                    rest.add(anchor);
                    h = heightOf(rest);
                }
                // Ellipsoid-Test in Ruhelage
                const rel = v2.copy(rest).sub(head.center);
                const q = v3.set(rel.x / head.axes.x, rel.y / head.axes.y, rel.z / head.axes.z);
                const s = Math.max(q.length(), 1e-4);
                const dist = (s - 1) * rel.length() / s;
                const pen = pickle.radius - dist;
                if (pen > best.pen) {
                    best.pen = pen;
                    best.h = h;
                    best.rest.copy(rest);
                    // Normale in Ruhelage -> Welt
                    best.n.set(q.x / head.axes.x, q.y / head.axes.y, q.z / head.axes.z).normalize();
                    rotateAA(best.n, angleAt(h, ang), 1);
                    best.p.copy(p).addScaledVector(best.n, -pickle.radius); // Kontaktpunkt
                }
            }
            return best.pen > 0;
        }

        function step(dt, t) {
            const anchor = U.uAnchor.value;

            // --- Gurke folgt dem Cursor (gedämpfte Feder) ---
            const k = CFG.followStiffness;
            const c = 2 * Math.sqrt(k) * CFG.followDamping;
            v1.copy(target).sub(pickle.pos).multiplyScalar(k).addScaledVector(pickle.vel, -c);
            pickle.vel.addScaledVector(v1, dt);
            if (pickle.vel.length() > 30) pickle.vel.setLength(30);
            pickle.pos.addScaledVector(pickle.vel, dt);

            // --- Kollision: Gurke darf NICHT in den Kopf ---
            if (head.ready) {
                for (let iter = 0; iter < 3 && findContact(); iter++) {
                    const n = best.n, h = best.h;
                    // 1) rausschieben
                    pickle.pos.addScaledVector(n, best.pen);

                    // 2) Impuls zwischen Gurke (Masse 1) und kippendem Kopf
                    arm.copy(best.p).sub(anchor);
                    const sH = bendS(h);
                    omega.copy(head.tiltVel).multiplyScalar(sH);
                    surfV.crossVectors(omega, arm);
                    const vRel = v2.copy(pickle.vel).sub(surfV);
                    const vn = vRel.dot(n);
                    if (vn < 0) {
                        const rxn = v3.crossVectors(arm, n);
                        const invHead = sH * sH * rxn.lengthSq() / CFG.headInertia;
                        const j = -(1 + CFG.bounce) * vn / (1 + invHead);
                        pickle.vel.addScaledVector(n, j);
                        // Drehimpuls auf den Kopf: tiltVel -= sH * (arm × n·j) / I
                        head.tiltVel.addScaledVector(rxn, -j * sH / CFG.headInertia);

                        // Reibung: Streifen nimmt den Kopf ein bisschen mit
                        const vt = vRel.addScaledVector(n, -vn);
                        const jt = vt.multiplyScalar(-0.25 / (1 + invHead));
                        pickle.vel.add(jt);
                        head.tiltVel.addScaledVector(v3.crossVectors(arm, jt), -sH / CFG.headInertia);

                        // Wackelpudding an der Trefferstelle
                        if (-vn > 0.3) {
                            addWobble(best.rest, v1.copy(n).multiplyScalar(vn * CFG.wobbleGain));
                            U.uSqDir.value.lerp(v1.copy(n).negate(), 0.5).normalize();
                            squash.v += Math.min(-vn, 15) * CFG.squashGain * (0.3 + Math.abs(n.y));
                        }
                    }
                }
            }

            // --- Punchingball-Feder (kippt um den festen Punkt unten) ---
            tiltPrevVel.copy(head.tiltVel);
            v1.set(Math.sin(t * 0.5) * 0.015, Math.sin(t * 0.37) * 0.04, Math.sin(t * 0.43) * 0.02); // leichtes Schweben
            v1.sub(head.tilt).multiplyScalar(CFG.headStiffness);
            head.tiltVel.addScaledVector(v1, dt);
            head.tiltVel.multiplyScalar(Math.max(0, 1 - CFG.headDamping * dt));
            head.tilt.addScaledVector(head.tiltVel, dt);
            if (head.tilt.length() > CFG.maxTilt) {
                head.tilt.setLength(CFG.maxTilt);
                const out = head.tiltVel.dot(v1.copy(head.tilt).normalize());
                if (out > 0) head.tiltVel.addScaledVector(v1, -out * 1.3);
            }

            // --- Nachschwingen oben: getrieben von der Kipp-Beschleunigung ---
            v1.copy(head.tiltVel).sub(tiltPrevVel);
            head.whipVel.addScaledVector(v1, -CFG.whipGain * 30);
            head.whipVel.addScaledVector(head.whip, -CFG.whipStiffness * dt);
            head.whipVel.multiplyScalar(Math.max(0, 1 - CFG.whipDamping * dt));
            head.whip.addScaledVector(head.whipVel, dt);
            if (head.whip.length() > 0.3) head.whip.setLength(0.3);

            // --- lokale Wabbel-Federn & Stauchen ---
            for (const w of wob) {
                w.v.addScaledVector(w.d, -CFG.wobbleStiffness * dt);
                w.v.multiplyScalar(Math.max(0, 1 - CFG.wobbleDamping * dt));
                w.d.addScaledVector(w.v, dt);
                if (w.d.length() > 0.35) w.d.setLength(0.35);
            }
            squash.v += -CFG.wobbleStiffness * 0.8 * squash.x * dt;
            squash.v *= Math.max(0, 1 - CFG.wobbleDamping * dt);
            squash.x = THREE.MathUtils.clamp(squash.x + squash.v * dt, -0.2, 0.2);
            U.uSq.value = squash.x;

            // --- Gurke ausrichten: Spitze zeigt in Bewegungsrichtung ---
            const sp = pickle.vel.length();
            if (sp > 0.6) {
                v1.copy(pickle.vel).divideScalar(sp);
                if (v1.dot(desiredAxis) < 0 && sp < 4) v1.negate();
                desiredAxis.lerp(v1, Math.min(1, sp * 0.6 * dt)).normalize();
            } else {
                v1.set(Math.cos(t * 0.7), Math.sin(t * 0.9) * 0.35, Math.sin(t * 0.5) * 0.3).normalize();
                desiredAxis.lerp(v1, 0.6 * dt).normalize();
            }
            pickle.axis.lerp(desiredAxis, Math.min(1, 10 * dt)).normalize();
        }

        // ================== LOOP ==================
        const clock = new THREE.Clock();
        const X = new THREE.Vector3(1, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 1 / 30);
            const t = clock.elapsedTime;

            updateTarget();
            const sub = 4;
            for (let i = 0; i < sub; i++) step(dt / sub, t);

            pickle.root.position.copy(pickle.pos);
            pickle.root.quaternion.setFromUnitVectors(X, pickle.axis);

            U.uCapR.value = pickle.radius * 1.05;
            U.uSegA.value.copy(pickle.pos).addScaledVector(pickle.axis, -pickle.half);
            U.uSegB.value.copy(pickle.pos).addScaledVector(pickle.axis, pickle.half);

            renderer.render(scene, camera);
        }
        animate();

        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
